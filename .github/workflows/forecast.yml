name: Previsión EuskOOS
on:
  schedule:
    - cron: '17 */3 * * *'   # cada 3 horas
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch.mjs
      - name: Guardar si hay cambios
        run: |
          git config user.name "pesca-bot"
          git config user.email "pesca-bot@users.noreply.github.com"
          git add docs/data/forecast.json
          git diff --staged --quiet || (git commit -m "previsión $(date -u +%FT%H:%MZ)" && git push)
