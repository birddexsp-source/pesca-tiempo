:root{
  --bg:#071218; --bg2:#0b1b23; --surface:#10232d; --surface2:#16303c; --line:#1f3d4b; --line2:#2b5063;
  --ink:#eaf4f6; --muted:#8fabb5; --dim:#5f7d88;
  --accent:#3fd0c9; --accent-ink:#04222a; --accent-soft:rgba(63,208,201,.14);
  --tide:#f2b84b; --tide-soft:rgba(242,184,75,.16);
  --wave:#58a8ff; --wave-soft:rgba(88,168,255,.18); --wind:#c79bff;
  --ok:#3ddc97; --near:#f2b84b; --no:#ff7a6b; --none:#6f8b96;
  --display:'Familjen Grotesk','Helvetica Neue',Arial,sans-serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:18px; --tabh:64px;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);overflow:hidden;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(63,208,201,.10),transparent 60%)}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:720px;margin:0 auto;position:relative}
.topbar{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 8px;gap:12px}
.topbar h1{font:700 22px/1 var(--display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.topbar h1 svg{width:24px;height:24px;color:var(--accent)}
.topbar .when{font:500 11px/1.35 var(--mono);color:var(--muted);text-align:right;text-transform:uppercase;letter-spacing:.07em}
main{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:4px 16px calc(var(--tabh) + 28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
main>*{flex-shrink:0}
main.fill{padding:0;overflow:hidden}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,rgba(7,18,24,0))}
.tabbar nav{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;border-radius:18px;text-decoration:none;color:var(--muted);font:600 11px/1 var(--display);letter-spacing:.03em;transition:background .2s,color .2s}
.tabbar a svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.fab{position:absolute;right:16px;bottom:calc(var(--tabh) + 22px + env(safe-area-inset-bottom,0px));z-index:25;display:inline-flex;align-items:center;gap:8px;padding:14px 20px;border:0;border-radius:999px;background:var(--tide);color:#2b1c00;font:700 15px/1 var(--display);box-shadow:0 8px 24px rgba(0,0,0,.5)}
.fab svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.flat{background:transparent}
.eyebrow{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.sect h2{font:700 20px/1.1 var(--display)}
.sect span{font-size:12.5px;color:var(--muted)}
.hint{color:var(--muted);font-size:13.5px}
.notice{background:var(--surface);border:1px dashed var(--line2);border-radius:var(--r);padding:20px;text-align:center;color:var(--muted)}
.notice strong{display:block;color:var(--ink);font:700 17px var(--display);margin-bottom:4px}
.btn{appearance:none;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);padding:12px 16px;border-radius:14px;font:600 14px/1 var(--body);min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.gold{background:var(--tide);border-color:var(--tide);color:#2b1c00}
.btn.danger{color:var(--no);border-color:rgba(255,122,107,.4);background:transparent}
.btn.small{padding:9px 12px;min-height:38px;font-size:13px;border-radius:12px}
.btn:disabled{opacity:.5}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;flex-wrap:wrap;gap:8px}

/* chips */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font:600 13.5px/1 var(--display)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;font:600 11.5px/1.2 var(--mono);background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:rgba(61,220,151,.5);background:rgba(61,220,151,.1)}
.pill.near,.pill.poco{color:var(--near);border-color:rgba(242,184,75,.5);background:rgba(242,184,75,.1)}
.pill.no,.pill.mucho{color:var(--no);border-color:rgba(255,122,107,.5);background:rgba(255,122,107,.1)}
.pill.accent{color:var(--accent);border-color:rgba(63,208,201,.5);background:var(--accent-soft)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--none);flex:none}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px rgba(61,220,151,.18)} .dot.near{background:var(--near)} .dot.no{background:var(--no)} .dot.none{background:transparent;border:2px solid var(--none)}

/* HOY */
.days{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:2px 16px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.daycard{scroll-snap-align:start;flex:0 0 auto;min-width:104px;padding:12px 14px;border-radius:18px;border:1.5px solid var(--line);background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.daycard[aria-pressed="true"]{border-color:var(--accent);background:linear-gradient(160deg,var(--surface2),var(--surface));box-shadow:0 0 0 3px var(--accent-soft)}
.daycard b{font:700 16px/1 var(--display)}
.daycard small{font:500 11px/1 var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.daycard .mini{display:flex;gap:8px;align-items:center;font:600 12px/1 var(--mono);color:var(--wave)}
.daycard .mini i{font-style:normal;color:var(--wind)}
.daycard .mini .dot{margin-left:auto}
.hero{position:relative;overflow:hidden;padding:0}
.hero .hd{display:flex;justify-content:space-between;align-items:flex-start;padding:16px 16px 0}
.hero h2{font:700 24px/1.05 var(--display)}
.hero .sub{font-size:13px;color:var(--muted);margin-top:4px}
.chart{display:block;width:100%;height:auto}
.chart text{font-family:var(--mono);fill:var(--muted);font-size:10px}
.chart .lbl{fill:var(--ink);font-weight:600;font-size:11px}
.chart .lbl2{fill:var(--muted);font-size:9.5px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.tile .ic{width:26px;height:26px;color:var(--c,var(--accent));margin-bottom:2px}
.tile .v{font:700 22px/1.1 var(--display)}
.tile .v small{font:500 12px var(--mono);color:var(--muted);margin-left:2px}
.tile .s{font-size:12.5px;color:var(--muted)}
.cardchart{padding:14px 14px 8px}
.cardchart .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.cardchart .hd b{font:700 16px var(--display)}
.dwhere{display:flex;flex-direction:column;gap:10px;padding:14px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);color:var(--ink)}
.dwhere .t{display:flex;align-items:center;gap:10px}
.dwhere .t h3{font:700 17px var(--display);flex:1;min-width:0}
.strip{position:relative;height:16px;border-radius:8px;background:var(--surface2);overflow:hidden}
.strip .night{position:absolute;top:0;bottom:0;background:rgba(0,0,0,.35)}
.strip .win{position:absolute;top:2px;bottom:2px;border-radius:6px;background:var(--ok)}
.strip .nowl{position:absolute;top:0;bottom:0;width:2px;background:var(--ink)}
.stripax{display:flex;justify-content:space-between;font:500 9.5px var(--mono);color:var(--dim);margin-top:-4px}
.why{font-size:13px;color:var(--muted)}
.best{font:700 15px var(--display);color:var(--ok)}

/* MAPA */
#mapwrap{position:relative;height:100%;background:#12303a}
#map{position:absolute;inset:0;background:#12303a}
.mlayers{position:absolute;left:12px;top:10px;z-index:900;display:flex;gap:2px;background:rgba(7,18,24,.78);backdrop-filter:blur(8px);padding:3px;border-radius:14px;border:1px solid var(--line)}
.mlayers button{border:0;background:none;padding:8px 12px;border-radius:11px;font:600 12.5px var(--display);color:var(--muted)}
.mlayers button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.mctl{position:absolute;right:12px;top:10px;z-index:900;display:flex;flex-direction:column;gap:8px}
.mctl button{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:rgba(7,18,24,.78);backdrop-filter:blur(8px);color:var(--ink);font:600 20px/1 var(--display);display:grid;place-items:center}
.mctl button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.carousel{position:absolute;left:0;right:0;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom,0px));z-index:850;display:flex;gap:10px;overflow-x:auto;padding:4px 16px 4px;scroll-snap-type:x proximity;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.scard{scroll-snap-align:center;flex:0 0 min(78%,280px);background:rgba(16,35,45,.94);backdrop-filter:blur(10px);border:1.5px solid var(--line);border-radius:18px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.scard.sel{border-color:var(--accent)}
.scard .t{display:flex;align-items:center;gap:8px}
.scard h3{font:700 16px var(--display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .s{font-size:12.5px;color:var(--muted)}
.mfab{bottom:calc(var(--tabh) + 152px + env(safe-area-inset-bottom,0px))}
.placebar{position:absolute;left:12px;right:12px;bottom:calc(var(--tabh) + 14px + env(safe-area-inset-bottom,0px));z-index:900;background:rgba(16,35,45,.97);border:1px solid var(--accent);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.placebar b{font:700 16px var(--display)}
.placebar .in{display:flex;gap:8px}
.placebar input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:11px 12px;font-size:14px}
.userdot{width:18px;height:18px;border-radius:50%;background:#3b82ff;border:3px solid #fff;box-shadow:0 0 0 8px rgba(59,130,255,.25)}
.leaflet-container{font-family:var(--body);background:#12303a;outline:0}
.leaflet-control-attribution{background:rgba(7,18,24,.7)!important;color:var(--muted)!important;font-size:9.5px!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.relief-blend{mix-blend-mode:multiply;opacity:.8}
.lpin{background:none;border:0}
.lpin svg{width:36px;height:44px;overflow:visible;filter:drop-shadow(0 3px 4px rgba(0,0,0,.6))}
.lpin path{stroke:#fff;stroke-width:1.8}
.lpin.ok path{fill:var(--ok)} .lpin.near path{fill:var(--near)} .lpin.no path{fill:var(--no)} .lpin.none path{fill:var(--accent)}
.lpin.sel svg{transform:scale(1.18);transform-origin:50% 100%}
.lpin .lbl{position:absolute;left:32px;top:4px;white-space:nowrap;font:700 12.5px var(--display);color:#fff;text-shadow:0 0 3px #000,0 0 5px #000,0 1px 2px #000}

/* SHEETS */
.sheet{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;animation:up .28s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto}
.sheet.picker{z-index:80}
@keyframes up{from{transform:translateY(36px);opacity:0}}
.sheet .sh{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px}
.sheet .sh h2{font:700 22px/1.1 var(--display);flex:1;min-width:0}
.sheet .x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center}
.sheet .x svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
.sheet .body{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px;overscroll-behavior:contain}
.sheet .foot{flex:0 0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;border-top:1px solid var(--line);background:var(--bg)}
.sheet .foot .btn{flex:1}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lab{font:600 11px/1 var(--mono);text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.field small{color:var(--muted);font-size:12.5px}
input[type=text],input[type=search],input[type=date],input[type=time],input:not([type]),select,textarea{width:100%;background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:12px 13px;font-size:16px;min-height:46px;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
input[type=date],input[type=time]{appearance:none;-webkit-appearance:none}
.block{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.block h3{font:700 16px var(--display);display:flex;align-items:center;gap:8px}
.block h3 svg{width:18px;height:18px;color:var(--accent)}
.verd{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.verd button{padding:11px 4px;border-radius:12px;border:1.5px solid var(--line2);background:var(--bg2);font:600 14px var(--display);color:var(--muted)}
.verd button.on.ok{background:var(--ok);border-color:var(--ok);color:#052013}
.verd button.on.poco{background:var(--near);border-color:var(--near);color:#2b1c00}
.verd button.on.mucho{background:var(--no);border-color:var(--no);color:#3a0b05}
.upload{display:flex;align-items:center;gap:12px;padding:14px;border:1.5px dashed var(--line2);border-radius:16px;background:var(--bg2);cursor:pointer}
.upload svg{width:28px;height:28px;color:var(--accent);flex:none}
.upload b{display:block;font:700 15px var(--display)}
.upload small{color:var(--muted);font-size:12.5px}
.upload input{display:none}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:14px;overflow:hidden;background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:1}
.irow{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px}
.irow .top{display:flex;gap:8px;align-items:center}
.irow .pick{flex:1;text-align:left;border:0;background:none;font:700 16px var(--display);padding:6px 2px;min-width:0}
.irow .pick.empty{color:var(--muted);font-weight:500}
.qty{display:flex;align-items:center;gap:4px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:var(--surface);font:600 18px/1 var(--display)}
.qty output{min-width:24px;text-align:center;font:700 16px var(--mono)}
.irow .opts{display:flex;gap:6px;align-items:center}
.sizes{display:flex;gap:4px;flex:1}
.sizes button{flex:1;padding:8px 0;border-radius:10px;border:1.5px solid var(--line2);background:var(--surface);font:700 13px var(--display);color:var(--muted)}
.sizes button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.irow select{width:auto;min-height:36px;padding:6px 8px;font-size:13px;border-radius:10px}

/* ficha de spot */
.shero{border-radius:22px;padding:18px;background:linear-gradient(150deg,#0f4a55,#0b2a36 60%,#0a1d27);border:1px solid var(--line2);position:relative;overflow:hidden}
.shero h2{font:700 28px/1.05 var(--display)}
.shero .sub{color:#b4d3da;font-size:13.5px;margin-top:6px}
.shero svg.waves{position:absolute;right:-10px;bottom:-6px;width:60%;opacity:.25}
.rules{display:grid;grid-template-columns:1fr;gap:10px}
.rule{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.rule .rh{display:flex;align-items:center;gap:10px}
.rule .rh svg{width:24px;height:24px;color:var(--c)}
.rule .rh b{font:700 15px var(--display);flex:1}
.rule .rv{font:700 20px var(--display)}
.rule .rv small{font:500 12px var(--mono);color:var(--muted)}
.ladder{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ladder i{font-style:normal;color:var(--dim)}
.tl{display:flex;flex-direction:column;gap:0}
.tli{display:grid;grid-template-columns:54px 1fr;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.tli:first-child{border-top:0}
.tli .dt{font:600 12px/1.2 var(--mono);color:var(--muted);text-transform:uppercase}
.tli .dt b{display:block;font:700 22px/1 var(--display);color:var(--ink)}
.tli .bd{display:flex;flex-direction:column;gap:6px;min-width:0}
.tli .pills{display:flex;gap:6px;flex-wrap:wrap}
.tli img{width:100%;max-height:220px;object-fit:cover;border-radius:14px}
.cap-sum{font-size:14px}
.cap-sum b{font-weight:600}

/* tarjetas salida / captura */
.tcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.tcard img.ph{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.tcard .bd{padding:14px;display:flex;flex-direction:column;gap:10px}
.tcard .hd{display:flex;gap:12px;align-items:flex-start}
.tcard .dt{flex:none;text-align:center;background:var(--surface2);border-radius:12px;padding:7px 10px;font:600 10.5px/1 var(--mono);color:var(--muted);text-transform:uppercase}
.tcard .dt b{display:block;font:700 22px/1.1 var(--display);color:var(--ink)}
.tcard h3{font:700 18px/1.15 var(--display)}
.tcard .sub{font-size:13px;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.note{font-size:14px;color:#cfe2e7;border-left:3px solid var(--line2);padding-left:10px}
.tcard .ft{display:flex;gap:8px;flex-wrap:wrap}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sum div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.sum b{display:block;font:700 26px/1 var(--display);color:var(--tide)}
.sum small{font:600 10.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{border:0;background:none;padding:11px;border-radius:12px;font:600 14px var(--display);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

/* especies */
.search{position:relative}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.search input{padding-left:42px;border-radius:999px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cromo{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 10px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--muted);min-width:0}
.cromo.got{background:linear-gradient(160deg,var(--surface2),var(--surface));border-color:var(--accent);color:var(--ink)}
.cromo .num{position:absolute;left:8px;top:6px;font:600 9.5px var(--mono);color:var(--dim)}
.cromo .art{width:100%;aspect-ratio:2/1;display:grid;place-items:center;color:var(--line2);margin-top:8px;overflow:hidden;border-radius:10px}
.cromo.got .art{color:var(--accent)}
.cromo .art svg{width:80%;height:auto}
.cromo .art img{width:100%;height:100%;object-fit:cover}
.cromo .nm{font:700 12.5px/1.15 var(--display);text-align:center}
.cromo .cn{font:700 11px var(--mono);color:var(--tide);min-height:12px}
.detail-art{border-radius:20px;background:var(--surface);border:1px solid var(--line);padding:18px;display:grid;place-items:center;color:var(--accent)}
.detail-art svg{width:70%}
.detail-art img{width:100%;border-radius:12px}
.sci{font-style:italic;color:var(--muted)}
#toast{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + 84px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:200;pointer-events:none}
#toast span{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font:600 14px var(--body);max-width:88%;box-shadow:0 8px 24px rgba(0,0,0,.5)}
/* fixes */
#mapwrap,#map,.leaflet-container{isolation:isolate;z-index:0}
.sheet .body{overflow-x:hidden}
.field input,.field select,.field textarea{min-width:0;max-width:100%}
.field>div[style*="display:flex"]>input{flex:1 1 0;min-width:0;width:0}
.row>.field{min-width:0}
input[type=time],input[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none}
.sheet .body>*{flex-shrink:0}

.leg{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface2);display:flex;flex-direction:column;gap:8px}
.leg .lh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.leg .lh b{font:700 16px var(--display)}.leg .lh span{font:600 13px var(--mono);color:var(--muted)}
.stopc{border:1.5px solid var(--line2);border-radius:18px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:10px}
.stopc .top{display:flex;justify-content:space-between;align-items:center}
.stopc .top b{font:700 16px var(--display);color:var(--accent)}
.stopc .x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:var(--bg);color:var(--muted);font-size:18px}
.tideline{font:500 13px/1.4 var(--mono);color:var(--tide)}
.pill.tide{color:var(--tide);border-color:rgba(242,184,75,.4)}
.stopc .ft{display:flex;gap:8px;flex-wrap:wrap}

.tlabel{pointer-events:none;z-index:350!important}
.tlabel span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font:600 12px var(--body);color:#fff;text-shadow:0 0 3px #000,0 0 3px #000,0 1px 5px #000;letter-spacing:.02em}
.tlabel.l1 span{font-size:15px;font-weight:700}
.tlabel.l4 span{font-style:italic;color:#bfe9ff}

.cfgbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none}
.cfgbtn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.topbar{gap:10px}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:-4px;z-index:5;background:var(--bg);padding:4px 0 8px}
.stp{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--muted);font:600 11px var(--display);letter-spacing:.03em}
.stp i{font-style:normal;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line2);font:700 12px var(--mono)}
.stp.on{color:var(--ink)}.stp.on i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stp.done i{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.posrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.est{border:1px dashed var(--line2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.est .eh{display:flex;justify-content:space-between;align-items:baseline}.est .eh b{font:700 14px var(--display)}
.pk #pkwrap{position:relative;flex:1;min-height:0}
#pkmap{position:absolute;inset:0;background:#0a1a22}
.pk .mlayers{position:absolute;left:12px;top:12px;z-index:800}
.pk .mctl{position:absolute;right:12px;top:12px;z-index:800;display:flex;flex-direction:column;gap:8px}
.pkbar{flex:0 0 auto;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}

.htx{flex:1;min-width:0}.htx h3{font:700 22px/1.1 var(--display);letter-spacing:-.01em;text-shadow:0 2px 12px rgba(0,0,0,.5)}.htx p{font:500 12.5px var(--body);color:#c6dbe1;text-transform:capitalize;margin-top:3px}
.fbadge{flex:none;text-align:center;background:var(--tide);color:#2b1c00;border-radius:14px;padding:6px 11px}

.tb{padding:14px 14px 12px;display:flex;flex-direction:column;gap:14px}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.kp b{font:700 16px/1.1 var(--display);white-space:nowrap}.kp b u{text-decoration:none;font:600 10px var(--mono);color:var(--muted);margin-left:2px}
.kp small{font:600 9.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}

.lb{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}

/* veredicto */

.pvtop .ring text{font-size:24px}

.ppend .pb{display:flex;flex-direction:column;gap:5px;min-width:0}.ppend b{font:700 15px var(--display)}.ppend small{font:500 12.5px var(--body);color:var(--muted)}

.mt2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.mtread{display:flex;align-items:center;gap:7px;min-width:0}.mtread>b{font:700 15px var(--mono)}
.mtread .conds>span{padding:2px 7px;font-size:11px}

.mpin{background:none;border:0}

.scard2{scroll-snap-align:center;flex:0 0 min(82%,300px);background:rgba(16,35,45,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1.5px solid var(--line);border-radius:20px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;color:var(--ink);box-shadow:0 10px 26px rgba(0,0,0,.45)}

.pfr{display:grid;grid-template-columns:62px 34px 1fr;gap:10px;align-items:center}
.pfr .ring text{font-size:10px}
.pfd{display:flex;flex-direction:column}.pfd b{font:700 13px var(--display);text-transform:capitalize}.pfd small{font:600 10px var(--mono);color:var(--muted)}
.pfw{display:flex;flex-direction:column;gap:3px;font:600 11.5px var(--mono);color:#c6dbe1;min-width:0}
.pfax{margin-left:116px}
/* capturas */
.cstat{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:16px;border-radius:24px;border:1px solid var(--line);background:linear-gradient(150deg,rgba(88,168,255,.1),var(--surface) 55%,var(--bg2))}
.cs1{display:flex;flex-direction:column;align-items:center;gap:2px}.cs1 small{font:600 10px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cs1 .ring text{font-size:18px}
.cs2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cs2 div{background:rgba(0,0,0,.2);border-radius:12px;padding:8px 10px}
.cs2 b{display:block;font:700 22px/1 var(--display)}.cs2 small{font:600 9.5px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.cs3{grid-column:1/-1;display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font:500 12px var(--body);color:var(--muted)}
.tabs2{display:flex;gap:6px}
.tabs2 button{flex:1;padding:9px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 13px var(--display)}
.tabs2 button[aria-pressed="true"]{border-color:var(--tide);color:var(--tide);background:var(--tide-soft)}
.cpanel{padding:14px}.cpanel .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}.cpanel .hd b{font:700 16px var(--display)}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:124px 1fr 28px;gap:8px;align-items:center}
.bl{font:600 13px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.04)}
.bt i{display:block;height:100%}.bt i.casa,.bt i.one{background:var(--accent)}.bt i.lib{background:var(--wave)}.bt i.esc{background:var(--no)}
.bt i.one{background:linear-gradient(90deg,var(--tide),#ffd27a)}
.bar>b{font:700 14px var(--display);text-align:right}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;height:130px;align-items:end}
.col{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.col .cv{font:700 12px var(--mono);color:var(--muted)}
.col .cb{flex:1;width:100%;max-width:40px;display:flex;align-items:flex-end;border-radius:10px;background:rgba(255,255,255,.04);overflow:hidden}
.col .cb i{display:block;width:100%;background:linear-gradient(to top,var(--accent),#7ff0e9);border-radius:10px 10px 0 0}
.col b{font:700 13px var(--display)}
.escs{display:flex;flex-direction:column;gap:10px}
.escr{padding:10px 12px;border-radius:12px;background:rgba(255,122,107,.07);border:1px solid rgba(255,122,107,.25);display:flex;flex-direction:column;gap:4px}
.escr p{font:italic 400 13.5px/1.45 var(--body);color:#e9d2cd}
.escr small{font:700 10px var(--mono);color:var(--muted);border:1px solid var(--line2);border-radius:6px;padding:1px 5px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gi{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:12px;overflow:hidden;background:var(--surface2)}
.gi img{width:100%;height:100%;object-fit:cover;display:block}
.gi span{position:absolute;left:6px;bottom:6px;font:700 10px var(--mono);background:rgba(7,18,24,.7);padding:2px 6px;border-radius:6px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.cph{position:relative;aspect-ratio:16/9}.cph img{width:100%;height:100%;object-fit:cover;display:block}
.cph span{position:absolute;right:10px;bottom:10px;font:700 12px var(--mono);background:rgba(7,18,24,.75);padding:3px 8px;border-radius:8px}
.cbd{padding:14px;display:flex;flex-direction:column;gap:10px}
.chd{display:flex;gap:12px;align-items:center}
.dchip.sm{background:var(--surface2);border-color:var(--line);backdrop-filter:none;padding:6px 9px}.dchip.sm b{font-size:19px}
.ctt{flex:1;min-width:0}.ctt h3{font:700 17px/1.15 var(--display)}.ctt p{font:500 12px var(--body);color:var(--muted)}
.cfish{text-align:center;background:var(--tide);color:#2b1c00;border-radius:12px;padding:5px 9px}.cfish b{display:block;font:700 18px/1 var(--display)}.cfish small{font:700 9px var(--mono);text-transform:uppercase}
.cgrp{display:flex;flex-direction:column;gap:6px}
.ccard .ft{display:flex;gap:8px}
@media (min-width:560px){.gax,.grow{grid-template-columns:150px 1fr}.pfax{margin-left:116px}}

.mhead{font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:var(--muted);display:flex;align-items:center;gap:10px}

.mclu{background:none;border:0}

.mclu .lbl{position:absolute;left:50%;top:58px;transform:translateX(-50%);white-space:nowrap;font:700 13px var(--display);color:#fff;text-shadow:0 0 3px #000,0 0 5px #000,0 1px 2px #000;pointer-events:none}
.fab.mfab{padding:11px 15px;font-size:13.5px}

.mctl .addpin{position:relative;background:var(--tide);border-color:var(--tide);color:#2b1c00}
.mctl .addpin svg{width:21px;height:21px;stroke:#2b1c00}
.mctl .addpin i{position:absolute;right:3px;top:1px;font:800 15px/1 var(--display);font-style:normal;color:#2b1c00}
.sct .btn{flex:none}
.scard2{gap:7px;padding:11px 13px}

.recipe{display:flex;flex-direction:column;gap:6px}

.pnext{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:14px;border:1px solid rgba(63,208,201,.4);background:var(--accent-soft);color:#c6dbe1;font-size:13.5px;text-align:left;position:relative;z-index:1}
.pnext svg{width:18px;height:18px;color:var(--accent)}.pnext b{color:var(--ink)}.pnext i{margin-left:auto;font:700 20px var(--display);font-style:normal;color:var(--accent)}

.mclu.pend .mpc.big{border-style:dashed}
.mclu.sel .mpc.big{box-shadow:0 0 0 4px var(--accent-soft),0 0 0 2px var(--accent)}
.sitelbl span{pointer-events:auto;cursor:pointer}
.sitelbl.sel span{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.scard2.site .sct h3{font-size:17px}
.scard2.site.sel{border-color:var(--accent)}
.schips{display:flex;flex-wrap:wrap;gap:5px}
.schips span{display:inline-flex;align-items:center;gap:5px;font:600 11px var(--mono);color:#c6dbe1;background:rgba(255,255,255,.06);border-radius:999px;padding:3px 8px;max-width:100%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.schips i{width:7px;height:7px;border-radius:50%;flex:none}.schips b{color:#fff}
.scard2.shead{flex:0 0 min(70%,250px);border-color:rgba(63,208,201,.5)}
.scard2.shead .actions{flex-wrap:wrap}
.pinch{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.pcb{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:18px;border-radius:18px;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink)}
.pcb b{font:700 22px var(--display)}.pcb span{font:500 13.5px/1.35 var(--body,inherit);color:var(--muted)}
.pcb:active{border-color:var(--tide)}
#sp-newwrap[hidden]{display:none}
.sitesp{display:flex;flex-direction:column;gap:2px;padding:6px}
.sprow{display:flex;align-items:center;gap:12px;padding:8px 8px;border:0;background:none;color:var(--ink);text-align:left;border-radius:12px;width:100%}
.sprow:active{background:var(--surface2)}
.sprow span{flex:1;min-width:0;display:flex;flex-direction:column}.sprow b{font:600 15px var(--display)}.sprow small{font:600 10.5px var(--mono);color:var(--muted)}
.sprow i{font-style:normal;color:var(--muted);font-size:20px}
.actions.col{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.sprow .ring text{font-size:10px}
.actions.col .btn{width:100%}
.leftrow{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 0;border-top:1px solid var(--line)}
.leftrow:first-of-type{border-top:0}
.leftrow b{font:700 14px var(--display);color:var(--tide)}.leftrow span{font:600 11px var(--mono);color:var(--muted);text-align:right}
.leftrow small{grid-column:1/-1;font:600 12px var(--mono);color:#c6dbe1}
.cromo .art img{object-fit:contain;padding:2px 3px;filter:grayscale(1) brightness(.6) opacity(.75);transition:filter .3s}
.cromo.got .art img{filter:none}
.detail-art{display:grid;place-items:center;padding:14px 10px}
.detail-art img{width:100%;height:auto;max-height:240px;object-fit:contain;border-radius:0}

/* valoración */
.rates{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.rates button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 2px 7px;border-radius:12px;border:1.5px solid var(--line2);background:var(--bg2);color:var(--muted);font-family:var(--display)}
.rates button b{font:700 17px/1 var(--display)}.rates button small{font:600 10px/1.2 var(--body);letter-spacing:.01em}
.rates button.on{color:#06131a;border-color:transparent}
.rates button.on.r1{background:#ff7a6b}.rates button.on.r2{background:#ff9f6b}.rates button.on.r3{background:#f2b84b}.rates button.on.r4{background:#9fdc6b}.rates button.on.r5{background:var(--ok)}
.g.rate{color:#f2b84b}.g.rate.r1,.g.rate.r2{color:#ff8f6b}.g.rate.r4,.g.rate.r5{color:var(--ok)}
.rtt{font:700 12.5px var(--mono);color:#f2b84b}.rtt.r1,.rtt.r2{color:#ff8f6b}.rtt.r4,.rtt.r5{color:var(--ok)}
.avgrate{display:flex;align-items:baseline;gap:10px;margin:4px 0 8px}.avgrate b{font-size:24px}.avgrate span{color:var(--muted);font-size:13px}
.rdist{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;height:56px;align-items:end}
.rdist span{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.rdist i{display:block;width:100%;border-radius:5px;background:#f2b84b;opacity:.85}.rdist .r1 i,.rdist .r2 i{background:#ff8f6b}.rdist .r4 i,.rdist .r5 i{background:var(--ok)}
.rdist small{font:600 10px var(--mono);color:var(--dim)}
/* confianza */
.conf{display:inline-flex;gap:2px;vertical-align:middle;margin-left:6px}
.conf i{width:6px;height:6px;border-radius:50%;background:var(--line2)}
.conf.c1 i:nth-child(1){background:var(--no)}.conf.c2 i:nth-child(-n+2){background:var(--near)}.conf.c3 i{background:var(--ok)}
.evl{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;line-height:1.4;color:var(--muted);margin:2px 0}
.evl .conf{margin:5px 0 0;flex:none}.evl b{color:var(--ink)}
.pvev{display:flex;flex-direction:column;gap:10px;margin-top:2px;position:relative;z-index:1}
.pvsp{display:flex;flex-direction:column;gap:7px}.pvsp .eyebrow{display:flex;align-items:center;gap:6px}.pvsp .eyebrow svg{width:14px;height:14px}
/* especies */
.spl{display:flex;flex-wrap:wrap;gap:6px}
.spc{display:inline-flex;align-items:baseline;gap:6px;padding:5px 10px;border-radius:999px;border:1px solid color-mix(in srgb,var(--c) 55%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);color:var(--ink);font-family:var(--display)}
.spc b{font:600 13px var(--display)}.spc small{font:500 10.5px var(--mono);color:var(--muted)}
.stsp{margin:2px 0 4px}
.spcond{display:flex;flex-direction:column;gap:9px}
.spsec small,.spk small{display:block;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-bottom:2px}
.spk{margin:0;font-size:13.5px}.spk small{display:inline;margin-right:8px}
.hstrip{width:100%;height:40px}.hstrip text{font:500 8px var(--mono);fill:var(--dim)}
.rates button small,.rates button.on small{color:inherit}

.qcbtn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);margin-left:auto}
.topbar .when{margin-left:0}
.qcbig{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border-radius:18px;border:1.5px solid var(--accent);background:linear-gradient(135deg,rgba(63,208,201,.22),rgba(63,208,201,.06));color:var(--ink);text-align:left;margin:4px 0 6px}
.qcbig .qb{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}

.qcbig b{display:block;font:700 17px var(--display)}.qcbig small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.qcl{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.qcday{border:1px solid var(--line2);background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.qcday header{display:flex;align-items:center;justify-content:space-between;gap:10px}
.qcday header b{font:700 15px var(--display)}.qcday header small{display:block;color:var(--muted);font-size:12px}
.qcrow{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.qcrow time{font:600 12.5px var(--mono);color:var(--accent);flex:none;width:44px}
.qcm{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.qcm b{font:600 15px var(--display)}.qcm .sz,.qcm .qn,.qcm .qd{font:600 11px var(--mono);color:var(--muted)}
.qcm small{flex-basis:100%;font-size:12px;color:var(--muted)}.qcm small.ok{color:var(--ok)}.qcm small.new{color:#58a8ff}
.qcx{border:0;background:none;color:var(--muted);font-size:15px;padding:6px 8px;border-radius:8px}
.qstat{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:10px 12px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.qstat .qt{font:700 15px var(--mono)}.qstat .qw{flex:1;min-width:140px;font-size:13px;color:var(--muted)}
.qstat .qw.ok{color:var(--ok)}.qstat .qw.new{color:#58a8ff}.qstat .qw.wait{color:var(--near)}
.qsps{display:flex;flex-wrap:wrap;gap:8px}
.qsp{padding:11px 16px;border-radius:999px;border:1.5px solid var(--line2);background:var(--bg2);color:var(--ink);font:600 15px var(--display)}
.qsp.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}.qsp.more{color:var(--accent);border-style:dashed}
.qsz{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.qsz button,.qdest button{padding:12px 4px;border-radius:12px;border:1.5px solid var(--line2);background:var(--bg2);color:var(--muted);font:700 15px var(--display)}
.qsz button[aria-pressed="true"],.qdest button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.qrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.qdest{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.qdest button{font-size:12.5px;padding:12px 2px}
.qqty{display:flex;align-items:center;gap:6px}.qqty button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line2);background:var(--bg2);color:var(--ink);font:700 22px var(--display)}
.qqty output{min-width:34px;text-align:center;font:700 20px var(--mono)}
#qc-body{display:flex;flex-direction:column;gap:14px}
.topbar h1{font-size:18.5px;white-space:nowrap}.topbar .when{font-size:10px;letter-spacing:.05em;white-space:nowrap}
.qstat .btn{padding:6px 12px;min-height:0}

.bchips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.bchips small{flex-basis:100%;font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.bchip{padding:7px 12px;border-radius:999px;border:1.5px solid var(--line2);background:var(--bg2);color:var(--muted);font:600 13px var(--display)}
.bchip.on{background:rgba(242,184,75,.16);border-color:#f2b84b;color:#f2b84b}
.baddrow{display:flex;gap:8px}.baddrow input{flex:1;min-width:0}
.brow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}.brow:first-of-type{border-top:0}
.brow b{font:600 15px var(--display)}.brow .bn{font:700 13px var(--mono);color:#f2b84b}.brow small{grid-column:1/-1;color:var(--muted);font-size:12px}
.qsp.sm{padding:8px 13px;font-size:13.5px}
.qadd{display:inline-flex;gap:6px;align-items:center}.qadd input{width:96px;padding:8px 10px;border-radius:999px}.qadd .btn{padding:6px 12px;min-height:0}

.swbig{border-color:var(--tide);background:linear-gradient(135deg,rgba(242,184,75,.22),rgba(242,184,75,.05))}
.swbig .qb{background:var(--tide);color:#2b1c00}
.swl{display:flex;flex-direction:column;gap:10px;margin-bottom:6px}
.swcard{border:1px solid var(--line2);background:var(--surface);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.swcard header b{font:700 15px var(--display)}.swcard header small{display:block;color:var(--muted);font-size:12px}
.swth{display:flex;gap:6px}.swth img{width:64px;height:64px;object-fit:cover;border-radius:12px}
.swmark{width:100%;min-height:54px;font-size:16px}

.swmb{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}

.swma{display:flex;flex-direction:column;gap:6px;align-items:flex-end}

.swgps{font:600 13px var(--mono);color:var(--accent)}
.sheet.sweep .body .upload input{display:none}

.gear{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.gdet>summary small{margin-left:auto;min-width:0;max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:600 11px var(--mono);color:var(--muted);text-align:right}

.gdet .gbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.gtop{background:var(--surface)}

.gitem{margin-top:8px;background:var(--surface2)}
.gdet textarea,.gdet input{width:100%}
.eqv{display:flex;flex-direction:column;gap:8px;margin:6px 0}
.eqrow b{font:700 12px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.eqrow em{display:block;font-style:normal;color:var(--accent);font-size:12.5px;margin-top:2px}

var LAT=43.42, LON=-2.72;
function sunUT(date,rise){
  var rad=Math.PI/180, deg=180/Math.PI;
  var start=Date.UTC(date.getFullYear(),0,0), now=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate());
  var N=Math.round((now-start)/86400000), lngH=LON/15, t=N+((rise?6:18)-lngH)/24;
  var M=0.9856*t-3.289;
  var L=M+1.916*Math.sin(M*rad)+0.020*Math.sin(2*M*rad)+282.634; L=((L%360)+360)%360;
  var RA=Math.atan(0.91764*Math.tan(L*rad))*deg; RA=((RA%360)+360)%360;
  RA+=(Math.floor(L/90)*90)-(Math.floor(RA/90)*90); RA/=15;
  var sinD=0.39782*Math.sin(L*rad), cosD=Math.cos(Math.asin(sinD));
  var cosH=(Math.cos(90.833*rad)-sinD*Math.sin(LAT*rad))/(cosD*Math.cos(LAT*rad));
  if(cosH>1||cosH<-1)return null;
  var H=rise?360-Math.acos(cosH)*deg:Math.acos(cosH)*deg; H/=15;
  var T=H+RA-0.06571*t-6.622, UT=T-lngH; UT=((UT%24)+24)%24;
  return Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())+UT*3600000;
}

function moon(date){
  var jd=date.getTime()/86400000+2440587.5, f=(((jd-2451550.1)/29.530588853)%1+1)%1;
  var name=f<0.03||f>=0.97?'Luna nueva':f<0.22?'Creciente':f<0.28?'Cuarto creciente':f<0.47?'Gibosa creciente':f<0.53?'Luna llena':f<0.72?'Gibosa menguante':f<0.78?'Cuarto menguante':'Menguante';
  var ill=Math.round((1-Math.cos(2*Math.PI*f))/2*100), d=Math.min(f,Math.abs(f-0.5),1-f), q=Math.min(Math.abs(f-0.25),Math.abs(f-0.75));
  return {name:name,ill:ill,tides:d<0.1?'mareas vivas':q<0.08?'mareas muertas':'mareas medias'};
}

function isoMs(s){return Date.parse(s)}
function mm(n){var h=Math.floor(n/60),m=Math.round(n%60);if(m===60){h++;m=0}return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')}
function tideEvents(fcs){
  var seen={},out=[];
  fcs.forEach(function(f){(f.tides||[]).forEach(function(e){if(!seen[e.t]){seen[e.t]=1;out.push({t:e.t,ms:isoMs(e.t),h:e.h,k:e.k})}})});
  return out.sort(function(a,b){return a.ms-b.ms});
}
function phaseAt(ev,ms){
  for(var i=0;i<ev.length-1;i++){
    if(ms>=ev[i].ms&&ms<ev[i+1].ms){
      var f=(ms-ev[i].ms)/(ev[i+1].ms-ev[i].ms);
      return ev[i].k==='low'?0.5*f:0.5+0.5*f;
    }
  }
  return null;
}
function inWin(p,a,b){return a<=b?(p>=a&&p<=b):(p>=a||p<=b)}
function interp(samples,dayMs,ms,key){
  if(!samples||!samples.length)return null;
  var t=(ms-dayMs)/3600000;
  if(t<=samples[0].h)return samples[0][key];
  for(var i=1;i<samples.length;i++){
    if(t<=samples[i].h){var a=samples[i-1],b=samples[i],f=(t-a.h)/(b.h-a.h);return a[key]+(b[key]-a[key])*f}
  }
  return samples[samples.length-1][key];
}
function evalSpot(spot,fc,ev){
  var hasRange=spot.minWave!=null||spot.maxWave!=null;
  if(!fc||!fc.samples||!fc.samples.length)return {status:'none',windows:[],reason:'Sin previsión cargada para este día.'};
  if(!hasRange)return {status:'none',windows:[],reason:'Apunta el oleaje que te funciona en este spot.'};
  var lo=spot.minWave!=null?spot.minWave:0, hi=spot.maxWave!=null?spot.maxWave:99;
  var tideSet=spot.from&&spot.to&&PH[spot.from]&&PH[spot.to];
  var A=tideSet?PH[spot.from].t:0, B=tideSet?PH[spot.to].t:1;
  var dayMs=isoMs(fc.date+'T00:00'), wins=[], cur=null, near=false, anyWave=false, anyWaveWind=false, minW=99, maxW=0, tideUnknown=false;
  for(var m=0;m<1440;m+=10){
    var ms=dayMs+m*60000, w=interp(fc.samples,dayMs,ms,'wave'), wd=interp(fc.samples,dayMs,ms,'wind');
    if(w==null)continue;
    if(w<minW)minW=w; if(w>maxW)maxW=w;
    var waveOK=w>=lo-0.001&&w<=hi+0.001, windOK=spot.maxWind==null||wd==null||wd<=spot.maxWind;
    var tideOK=true;
    if(tideSet){var p=phaseAt(ev,ms); if(p==null){tideOK=false;tideUnknown=true}else tideOK=inWin(p,A,B)}
    if(waveOK)anyWave=true;
    if(waveOK&&windOK)anyWaveWind=true;
    if(waveOK&&windOK&&tideOK){if(!cur)cur=[m,m+10];else cur[1]=m+10}
    else{if(cur){wins.push(cur);cur=null}}
    if(!waveOK&&w>=lo-0.3&&w<=hi+0.3&&windOK&&tideOK)near=true;
  }
  if(cur)wins.push(cur);
  wins=wins.filter(function(x){return x[1]-x[0]>=30});
  var rng=num(minW)+(Math.abs(minW-maxW)>=0.05?'–'+num(maxW):'')+' m';
  if(wins.length)return {status:'ok',windows:wins,reason:'Oleaje de '+rng+' dentro de tu rango.'};
  if(near)return {status:'near',windows:[],reason:'Oleaje de '+rng+', un poco fuera de tu rango ('+num(lo)+'–'+num(hi)+' m).'};
  var why;
  if(maxW<lo-0.001)why='Oleaje de '+rng+', por debajo de tu rango ('+num(lo)+'–'+(spot.maxWave!=null?num(hi):'')+' m).';
  else if(minW>hi+0.001)why='Oleaje de '+rng+', por encima de tu rango ('+(spot.minWave!=null?num(lo):'')+'–'+num(hi)+' m).';
  else if(anyWave&&!anyWaveWind)why='El oleaje encaja ('+rng+') pero el viento pasa de tu límite.';
  else if(anyWaveWind&&tideSet)why='El oleaje encaja ('+rng+') pero no coincide con tu ventana de marea.'+(tideUnknown?' Faltan horas de marea para parte del día.':'');
  else why='Oleaje de '+rng+', fuera de tu rango.';
  return {status:'no',windows:[],reason:why};
}

  if(diff===0)return 'Hoy'; if(diff===1)return 'Mañana'; if(diff===2)return 'Pasado';
  return new Intl.DateTimeFormat('es-ES',{weekday:'short',day:'numeric'}).format(d);
}
function longDate(iso){if(!iso)return '';return new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(dateOf(iso))}
function dparts(iso){var d=dateOf(iso);return {d:d.getDate(),m:new Intl.DateTimeFormat('es-ES',{month:'short'}).format(d).replace('.','')}}
function toast(msg){var t=$('#toast');t.innerHTML='<span>'+esc(msg)+'</span>';clearTimeout(toastT);toastT=setTimeout(function(){t.innerHTML=''},4200)}
function toNum(s){var v=parseFloat(String(s==null?'':s).replace(',','.'));return isFinite(v)?v:null}
function parseCoords(s){
  s=String(s||'');
  var m=s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/[?&](?:q|ll|query)=(-?\d+\.\d+)(?:,|%2C)(-?\d+\.\d+)/);
  if(m)return {lat:+m[1],lon:+m[2]};
  m=s.match(/-?\d+(?:[.,]\d+)?/g); if(!m||m.length<2)return null;
  var la=parseFloat(m[0].replace(',','.')), lo=parseFloat(m[1].replace(',','.'));
  if(!isFinite(la)||!isFinite(lo)||Math.abs(la)>90||Math.abs(lo)>180)return null;
  return {lat:la,lon:lo};
}
function confirmTwice(key,btn,label,fn){
  if(pending[key]){clearTimeout(pending[key]);delete pending[key];fn();return}
  btn.textContent='Pulsa otra vez para borrar';
  pending[key]=setTimeout(function(){delete pending[key];btn.textContent=label},4000);
}
function fcFuture(){var t=todayISO();return forecast.filter(function(f){return f.date>=t}).sort(function(a,b){return a.date<b.date?-1:1})}
function fcOf(iso){return forecast.find(function(f){return f.date===iso})||null}

var legs=[];
function rebuildLegs(){legs=[];trips.forEach(function(t){var st=t.stops&&t.stops.length?t.stops:((t.spotId||t.wave!=null)?[{id:'0'}]:[]);st.forEach(function(s,i){var l=Object.assign({},t,s);l.id=t.id+'_'+(s.id!=null?s.id:i);l.tripId=t.id;l.stopId=String(s.id!=null?s.id:i);l.stops=null;legs.push(l)})})}
function tripsOfSpot(id){return legs.filter(function(t){return t.spotId===id})}
function catchesOfLeg(l){var out=[];catches.forEach(function(c){if(c.tripId!==l.tripId)return;var its=(c.items||[]).filter(function(i){return i.stopId!=null?String(i.stopId)===l.stopId:(c.stopId!=null?String(c.stopId)===l.stopId:c.spotId===l.spotId)});if(its.length)out.push(Object.assign({},c,{items:its}))});return out}
function catchesOfSpot(id){var out=[],seen={};legs.filter(function(l){return l.spotId===id}).forEach(function(l){if(seen[l.tripId])return;seen[l.tripId]=1;catchesOfLeg(l).forEach(function(c){out.push(c)})});catches.forEach(function(c){if(!c.tripId&&c.spotId===id)out.push(c)});return out}

function fishCount(c){return (c.items||[]).reduce(function(a,i){return a+(i.n||0)},0)}
var MODES=['Corcho','Fondo','Spinning','Surfcasting','Jigging','Solo mirar el mar'];

var VL={poco:'Poco',ok:'Perfecto',mucho:'Demasiado'};
function spotTrips(id){return legs.filter(function(t){return t.spotId===id})}
function histOf(s,key,vk){
  return spotTrips(s.id).filter(function(t){return t[key]!=null&&t[vk]}).sort(function(a,b){return String(a.date).localeCompare(String(b.date))}).map(function(t){return {date:t.date,v:t[key],verdict:t[vk]}});
}
function pick(h,verdict){return h.filter(function(x){return x.verdict===verdict}).map(function(x){return x.v})}
function mn(a){return a.length?Math.min.apply(null,a):null}
function mx(a){return a.length?Math.max.apply(null,a):null}
function spotLearn(s){
  var hw=histOf(s,'wave','waveV'), hd=histOf(s,'wind','windV'), L={hw:hw,hd:hd};
  L.tooHigh=mn(pick(hw,'mucho')); L.tooLow=mx(pick(hw,'poco')); L.okLo=mn(pick(hw,'ok')); L.okHi=mx(pick(hw,'ok'));
  L.windTooMuch=mn(pick(hd,'mucho')); L.windOk=mx(pick(hd,'ok'));
  var okT=spotTrips(s.id).filter(function(t){return t.waveV==='ok'&&t.tpFrom&&t.tpTo}).sort(function(a,b){return String(b.date).localeCompare(String(a.date))});
  L.tide=okT.length?{from:okT[0].tpFrom,to:okT[0].tpTo}:null;
  return L;
}
function effSpot(s){
  var L=spotLearn(s), e=Object.assign({},s);
  if(s.minWave==null&&s.maxWave==null){
    if(L.okLo!=null){
      e.minWave=Math.max(0,L.okLo-0.1); e.maxWave=L.okHi+0.1;
      if(L.tooHigh!=null)e.maxWave=Math.min(e.maxWave,L.tooHigh-0.05);
      if(L.tooLow!=null)e.minWave=Math.max(e.minWave,L.tooLow+0.05);
    }else{
      if(L.tooHigh!=null)e.maxWave=Math.max(0,L.tooHigh-0.05);
      if(L.tooLow!=null)e.minWave=L.tooLow+0.05;
    }
  }
  if(s.maxWind==null){
    var w=null;
    if(L.windOk!=null)w=L.windOk+2;
    if(L.windTooMuch!=null)w=w==null?L.windTooMuch-1:Math.min(w,L.windTooMuch-1);
    if(w!=null)e.maxWind=w;
  }
  if(!(s.from&&s.to)&&L.tide){e.from=L.tide.from;e.to=L.tide.to}
  return e;
}
function rangeText(a,b){
  if(a!=null&&b!=null)return a===b?num(a)+' m':num(a)+'–'+num(b)+' m';
  if(b!=null)return 'hasta '+num(b)+' m'; if(a!=null)return 'desde '+num(a)+' m'; return '';
}
function ruleWave(s,L){
  if(s.minWave!=null||s.maxWave!=null)return rangeText(s.minWave,s.maxWave)+' (fijado a mano)';
  if(L.okLo!=null)return (L.okLo===L.okHi?num(L.okLo)+' m':num(L.okLo)+'–'+num(L.okHi)+' m')+' · tu oleaje ideal';
  if(L.tooHigh!=null&&L.tooLow!=null)return 'Entre '+num(L.tooLow)+' y '+num(L.tooHigh)+' m';
  if(L.tooHigh!=null)return 'Por debajo de '+num(L.tooHigh)+' m';
  if(L.tooLow!=null)return 'Por encima de '+num(L.tooLow)+' m';
  return '';
}
function ruleWind(s,L){
  if(s.maxWind!=null)return 'hasta '+num(s.maxWind,0)+' kph (fijado a mano)';
  if(L.windOk!=null&&L.windTooMuch!=null)return 'hasta '+num(L.windOk,0)+' kph · con '+num(L.windTooMuch,0)+' ya es demasiado';
  if(L.windOk!=null)return 'hasta '+num(L.windOk,0)+' kph · lo máximo que te ha ido bien';
  if(L.windTooMuch!=null)return 'por debajo de '+num(L.windTooMuch,0)+' kph';
  return '';
}
function histChips(h,unit,d){return h.length?'<div class="hist">'+h.map(function(x){return '<span class="hv '+x.verdict+'">'+num(x.v,d)+' '+unit+' · '+VL[x.verdict]+'</span>'}).join('<i>→</i>')+'</div>':''}

function tideCurve(ev){
  if(ev.length<2)return null;
  var E=ev.slice(), avg=function(k){var a=ev.filter(function(e){return e.k===k}).map(function(e){return e.h});return a.length?a.reduce(function(x,y){return x+y},0)/a.length:null};
  var f=E[0], l=E[E.length-1];
  var hi=avg('high'), lo=avg('low');
  E.unshift({ms:f.ms-(E[1].ms-f.ms),h:f.k==='high'?(lo!=null?lo:f.h-2):(hi!=null?hi:f.h+2),k:f.k==='high'?'low':'high'});
  E.push({ms:l.ms+(l.ms-E[E.length-2].ms),h:l.k==='high'?(lo!=null?lo:l.h-2):(hi!=null?hi:l.h+2),k:l.k==='high'?'low':'high'});
  return function(ms){
    for(var i=0;i<E.length-1;i++){
      if(ms>=E[i].ms&&ms<=E[i+1].ms){var f=(ms-E[i].ms)/(E[i+1].ms-E[i].ms);return E[i].h+(E[i+1].h-E[i].h)*(1-Math.cos(Math.PI*f))/2}
    }
    return null;
  };
}

    '<rect x="'+X(0)+'" y="'+pt+'" width="'+(X(srm)-X(0)).toFixed(1)+'" height="'+(H-pt-pb)+'" fill="#000" opacity=".28"/>'+
    '<rect x="'+X(ssm).toFixed(1)+'" y="'+pt+'" width="'+(X(1440)-X(ssm)).toFixed(1)+'" height="'+(H-pt-pb)+'" fill="#000" opacity=".28"/>';
  for(var hh=0;hh<=24;hh+=3){s+='<line x1="'+X(hh*60).toFixed(1)+'" x2="'+X(hh*60).toFixed(1)+'" y1="'+pt+'" y2="'+(H-pb)+'" stroke="#fff" stroke-opacity=".06"/><text x="'+X(hh*60).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+String(hh%24).padStart(2,'0')+'</text>'}
  s+='<path d="'+area+'" fill="url(#tg)"/><path d="'+path+'" fill="none" stroke="#3fd0c9" stroke-width="2.6" stroke-linejoin="round"/>';
  ev.filter(function(e){return e.ms>=day0-1&&e.ms<day0+86400000}).forEach(function(e){

      '<text class="lbl" x="'+Math.max(26,Math.min(W-26,x)).toFixed(1)+'" y="'+ty.toFixed(1)+'" text-anchor="middle">'+e.t.slice(11,16)+'</text>'+
      '<text class="lbl2" x="'+Math.max(26,Math.min(W-26,x)).toFixed(1)+'" y="'+(ty+(hi?11:11)).toFixed(1)+'" text-anchor="middle">'+(hi?'pleamar':'bajamar')+' '+num(e.h)+' m</text>';
  });
  if(iso===todayISO()){var nowM=(Date.now()-day0)/60000;if(nowM>=0&&nowM<=1440){s+='<line x1="'+X(nowM).toFixed(1)+'" x2="'+X(nowM).toFixed(1)+'" y1="'+(pt-6)+'" y2="'+(H-pb)+'" stroke="#fff" stroke-width="1.6" stroke-dasharray="3 3"/><text x="'+X(nowM).toFixed(1)+'" y="'+(pt-10)+'" text-anchor="middle" style="fill:#fff">ahora</text>'}}
  return s+'</svg>';
}
function lineChart(fc,key,gustKey,color,unit,maxMin){
  var S=(fc.samples||[]).slice().sort(function(a,b){return a.h-b.h}); if(!S.length)return '';

  return s+'</svg>';

function rngOf(fc,key,from){

function rtxt(r,d){return r?(Math.abs(r[1]-r[0])<0.05?num(r[0],d):num(r[0],d)+'–'+num(r[1],d)):'–'}

function windowsText(wins,iso){

function parseTides(text,date){
  var out=[];
  String(text||'').split(/[·\n;]+/).forEach(function(p){
    var m=p.match(/(plea|alta|high|baja|low)\w*[^0-9]*?(\d{1,2})[:.h](\d{2})(?:[^0-9]+(\d+(?:[.,]\d+)?)\s*m)?/i); if(!m||m[4]==null)return;
    var k=/plea|alta|high/i.test(m[1])?'high':'low', t=date+'T'+String(m[2]).padStart(2,'0')+':'+m[3];
    out.push({t:t,ms:isoMs(t),h:parseFloat(m[4].replace(',','.')),k:k});
  });
  return out;
}
function tideEvFor(date,text){
  var all=parseTides(text,date).concat(tideEvents(forecast)), seen={}, o=[];
  all.forEach(function(e){var k=Math.round(e.ms/900000);if(!seen[k]){seen[k]=1;o.push(e)}});
  return o.sort(function(a,b){return a.ms-b.ms});
}
function tideH(ev,ms){
  for(var i=0;i<ev.length-1;i++){
    if(ms>=ev[i].ms&&ms<=ev[i+1].ms){var f=(ms-ev[i].ms)/(ev[i+1].ms-ev[i].ms);return (ev[i].h+ev[i+1].h)/2+(ev[i].h-ev[i+1].h)/2*Math.cos(Math.PI*f)}
  }
  return null;
}
function nearPhase(p){if(p==null)return null;var best=null,bd=9;PHASES.forEach(function(x){var d=Math.min(Math.abs(x.t-p),1-Math.abs(x.t-p));if(d<bd){bd=d;best=x.k}});return best}
function dayRange(ev,date){
  var h=ev.filter(function(e){return e.t.slice(0,10)===date}).map(function(e){return e.h});
  return h.length>1?Math.max.apply(null,h)-Math.min.apply(null,h):null;
}
function rangeClass(r){return r==null?'':r<3.1?'mareas muertas':r<3.7?'mareas medias':'mareas vivas'}
function stopTide(date,s,text){
  var ev=tideEvFor(date,text), a=s.tFrom?isoMs(date+'T'+s.tFrom):null, b=s.tTo?isoMs(date+'T'+s.tTo):a;
  var r={hA:a!=null?tideH(ev,a):null,hB:b!=null?tideH(ev,b):null,range:dayRange(ev,date)};
  r.tpFrom=a!=null?nearPhase(phaseAt(ev,a)):null; r.tpTo=b!=null?nearPhase(phaseAt(ev,b)):null;
  return r;
}

function compress(file){
  return new Promise(function(resolve){
    var url=URL.createObjectURL(file), img=new Image();
    img.onload=function(){
      var max=1600, r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      var c=document.createElement('canvas'); c.width=Math.round(img.naturalWidth*r); c.height=Math.round(img.naturalHeight*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      c.toBlob(function(b){resolve(b||file)},'image/jpeg',0.85);
    };
    img.onerror=function(){URL.revokeObjectURL(url);resolve(file)};
    img.src=url;
  });
}

function speciesStats(){
  var m={};
  catches.forEach(function(t){(t.items||[]).forEach(function(i){
    var k=norm(i.species); if(!m[k])m[k]={n:0,lib:0,extra:0,name:i.species};
    m[k].n+=i.n||0; if(i.st==='lib')m[k].lib+=i.n||0; if(i.st==='extra')m[k].extra+=i.n||0;
  })});
  return m;
}
function allSpecies(){
  var st=speciesStats(), list=SPECIES.map(function(s){return {k:s.k,n:s.n,i:s.i,sh:s.sh,st:st[norm(s.n)]||null,known:true}}), n=SPECIES.length;
  var known={};SPECIES.forEach(function(s){known[norm(s.n)]=1});
  Object.keys(st).forEach(function(k){if(!known[k]){n++;list.push({k:'x-'+k,n:st[k].name,i:n,sh:'fusi',st:st[k],known:false})}});
  return list;
}
function matches(s,q){
  if(!q)return true; var Q=norm(q), sp=SPB[s.k];
  return norm(s.n).indexOf(Q)>-1||(sp&&(norm(sp.s).indexOf(Q)>-1||norm(sp.al).indexOf(Q)>-1||norm(sp.g||'').indexOf(Q)>-1));
}
function rank(list,q){
  var Q=norm(q||''); if(!Q)return list;
  var sc=function(s){var sp=SPB[s.k],n=norm(s.n),a=' '+norm(sp?sp.al:'').replace(/,/g,' ');
    if(n===Q)return 0; if(n.indexOf(Q)===0)return 1; if(a.indexOf(' '+Q)>-1||(' '+n).indexOf(' '+Q)>-1)return 2; return 3};
  return list.map(function(s,i){return [sc(s),i,s]}).sort(function(a,b){return a[0]-b[0]||a[1]-b[1]}).map(function(x){return x[2]});
}

    var i0=a+k*3, sum=0,c=0;for(var j=i0;j<i0+3;j++){if(v[j]!=null){sum+=v[j];c++}}
    var x=c?sum/c:null, col, op;
    if(blue){col='#58a8ff';op=x==null?0:x>=0.62?0.35+0.6*(x-0.62)/0.38:x>=0.4?0.18:0}

  S.forEach(function(x){if(x.wind==null)return;var cx=X(x.h*60),col=x.wind<12?'#3ddc97':x.wind<20?'#c79bff':x.wind<30?'#f2b84b':'#ff7a6b';

function verdictCard(P){

function siteRecipe(G){
  var wl=[],wh=[],wd=[],tl=[],th=[];

var selSite=null, siteDraft=null;

function siteSpots(id){return spots.filter(function(s){return s.siteId===id})}
function sitePos(st){
  var sp=siteSpots(st.id).filter(function(s){return s.lat!=null}), pts=sp.map(function(s){return [s.lat,s.lon]});
  var c=null;
  if(st.lat!=null)c=[st.lat,st.lon];
  else if(pts.length)c=[pts.reduce(function(a,p){return a+p[0]},0)/pts.length,pts.reduce(function(a,p){return a+p[1]},0)/pts.length];
  if(!c)return null;

function siteFiltered(st){

function siteG(P,id){return P.G?P.G.find(function(g){return g.site&&g.site.id===id})||null:null}

    if(pos){

function drawLayer(){
  if(!LMAP||!LMARK)return;
  LMARK.clearLayers(); ensurePlanT();
  if(!LMAP._plz){LMAP._plz=1;LMAP.on('zoomend',function(){if(!placing)drawLayer()})}
  var P=planFor(mapDay()), i=Math.round(planT/10), z=LMAP.getZoom(), clustered={};
  sites.forEach(function(st){
    if(!siteFiltered(st))return;
    var pos=sitePos(st); if(!pos)return;
    var S=siteSeries(P,st), gv=S.v?S.v[i]:null, n=siteSpots(st.id).length, sel=st.id===selSite;
    if(z<15.5){
      siteSpots(st.id).forEach(function(s){clustered[s.id]=1});
      var m=L.marker([pos.la,pos.lo],{keyboard:false,zIndexOffset:300+(sel?200:0),icon:siteIcon(st,gv,S.pend,n,sel)});
      m.on('click',function(e){L.DomEvent.stopPropagation(e);selectSite(st.id)});
      LMARK.addLayer(m);
    }else{
      var r=pos.pts.reduce(function(a,p){return Math.max(a,LMAP.distance([pos.la,pos.lo],p))},0)+45, col=S.pend?'#58a8ff':gv!=null?scCol(gv):'#3fd0c9';

/* ---------- «me fui por…»: la app calcula ola, viento y agua a esa hora ---------- */
function leftArr(x){return Array.isArray(x)?x.slice():x?[x]:[]}
var LEFTW={ola:'Mucha ola',viento:'Mucho viento',marea_alta:'Marea alta',marea_baja:'Marea baja'};
function leftSnapOf(date,s){
  var m=s&&s.tTo?hm(s.tTo):null; if(m==null||!date)return {};
  var P=planFor(date), c=P&&P.C?condAt(P,m):null; if(!c)return {};
  var r=function(x){return x==null?null:Math.round(x*100)/100};
  return {wave:r(c.wave),wind:c.wind==null?null:Math.round(c.wind),h:r(c.h)};
}
function leftBlock(s,i){
  return '<div class="field"><label>¿Te fuiste por algo?</label><div class="chips">'+Object.keys(LEFTW).map(function(k){return '<button type="button" class="chip" data-a="left-why" data-si="'+i+'" data-v="'+k+'" aria-pressed="'+(leftArr(s.leftWhy).indexOf(k)>-1)+'">'+LEFTW[k]+'</button>'}).join('')+'</div><p class="tideline" id="stl-'+i+'"></p></div>';
}
function updLeft(i){
  var el=$('#stl-'+i), s=tripDraft&&tripDraft.stops[i]; if(!el||!s)return;
  if(!s.tTo){el.textContent=leftArr(s.leftWhy).length?'Pon la hora a la que te fuiste («Me fui») para apuntar el límite.':'';return}
  var q=leftSnapOf(tripDraft.date,s);
  if(q.wave==null&&q.wind==null&&q.h==null){el.textContent=leftArr(s.leftWhy).length?'No tengo previsión guardada para esa hora, así que no puedo apuntar el límite.':'';return}
  el.textContent='A las '+s.tTo+': ola '+(q.wave!=null?num(q.wave)+' m':'–')+' · viento '+(q.wind!=null?q.wind+' kph':'–')+' · agua '+(q.h!=null?num(q.h)+' m':'–')+(leftArr(s.leftWhy).length?' → se apunta como límite de este spot'+(leftArr(s.leftWhy).length>1?' (cada motivo marcado cuenta).':'.'):'');
}

  }

/* ---------- luz: roquedo (necesito luz y tiempo para salir) vs puerto (libre) ---------- */
var CIVIL=30*60000;
function lightCfg(s){
  var st=s&&s.siteId?siteOf(s.siteId):null;
  var mode=(s&&s.light)||(st&&st.light)||'dia';
  var ex=s&&s.exitMin!=null?s.exitMin:st&&st.exitMin!=null?st.exitMin:20;
  return {mode:mode,exit:ex};
}
/* factor de luz de un tramo de 10 min para un spot */
function lightFor(L,c){
  if(!L||L.mode==='libre'||c.sr==null||c.ss==null)return L&&L.mode==='libre'?1:c.light;
  var ms=c.ms, dawn=c.sr-CIVIL, last=c.ss+CIVIL-L.exit*60000;
  if(ms<dawn)return 0.1;
  if(ms<c.sr)return 0.85;
  if(ms<=last)return 1;
  if(ms<last+CIVIL)return 0.5-0.4*(ms-last)/CIVIL;
  return 0.1;
}
function lightWin(L,C){
  if(!C||C.sr==null||C.ss==null||!L||L.mode==='libre')return null;
  var f=function(ms){var d=new Date(ms);return mm(d.getHours()*60+d.getMinutes())};
  return {from:f(C.sr-CIVIL),to:f(C.ss+CIVIL-L.exit*60000)};
}
function lightBlock(pre,light,exit,inherit){
  var opts=(inherit?'<option value="">Como el sitio</option>':'')+'<option value="dia"'+(light==='dia'?' selected':'')+'>Necesito luz (roquedo, rocas)</option><option value="libre"'+(light==='libre'?' selected':'')+'>Puedo ir de noche (puerto, paseo)</option>';
  return '<div class="block"><h3>Luz y salida</h3><p class="hint">En roquedo conviene llegar con luz y salir antes de que se vaya, contando el crepúsculo. En puerto o sitios fáciles no importa la hora.</p>'+
    '<div class="field"><label for="'+pre+'-light">Luz</label><select id="'+pre+'-light">'+opts+'</select></div>'+
    '<div class="field"><label for="'+pre+'-exit">Minutos que tardo en salir de aquí</label><input id="'+pre+'-exit" inputmode="numeric" placeholder="'+(inherit?'Como el sitio (20 por defecto)':'20')+'" value="'+(exit==null?'':esc(String(exit)))+'"></div></div>';
}

/* ---------- modelo ---------- */
function gk(d,s){return Math.exp(-d*d/(2*s*s))}
function legMid(l){if(l.hA==null)return null;var b=l.hB!=null?l.hB:l.hA;return (l.hA+b)/2}
function legHour(l){var a=hm(l.tFrom),b=hm(l.tTo);if(a==null)return null;if(b==null||b<a)return a/60;return (a+b)/120}

function legSim(l,c){
  var w=1,k=0;
  if(l.wave!=null&&c.wave!=null){w*=gk(l.wave-c.wave,0.45);k++}
  if(l.wind!=null&&c.wind!=null){w*=gk(l.wind-c.wind,7);k++}
  var h=legMid(l);if(h!=null&&c.h!=null){w*=gk(h-c.h,0.55);k++}
  return k?w:0;
}
/* resultado de la salida a un spot, 0..1 (null = no se sabe) */
function legOutcome(l){
  if(l.rate>=1&&l.rate<=5)return {o:(l.rate-1)/4,w:1,ex:true};
  if(l.tripRate>=1&&l.tripRate<=5)return {o:(l.tripRate-1)/4,w:0.5};
  if(fishOfLeg(l)>0)return {o:0.75,w:0.5};
  return null;
}
function legInfo(l){return !!(l.waveV||l.windV||l.tideV||leftArr(l.leftWhy).length)}
var _spotModel=spotModel;
spotModel=function(s){
  var M=_spotModel(s);M.R=[];M.rated=0;
  legsOfSpot(s.id).forEach(function(l){
    var o=legOutcome(l);
    if(o){M.R.push({l:l,o:o.o,w:o.w});if(o.ex)M.rated++}
    else if(legInfo(l))M.R.push({l:l,o:null,w:0});
  });
  var tr={};M.R.forEach(function(r){tr[r.l.tripId]=1});M.outs=Object.keys(tr).length;
  if(M.rated)M.any=true;
  return M;
};
function histFactor(M,c){
  var sw=0,so=0;
  M.R.forEach(function(r){if(r.o==null)return;var s=legSim(r.l,c)*r.w;sw+=s;so+=s*r.o});
  var hist=(so+0.6*0.6)/(sw+0.6);
  return {f:Math.max(0.5,Math.min(1.2,0.55+0.75*hist)),sw:sw,hist:hist};
}
var _slotScore=slotScore;
slotScore=function(M,c){
  var r=_slotScore(M,c);
  if(M.R&&M.R.some(function(x){return x.o!=null})){var H=histFactor(M,c);r.v=Math.min(1,r.v*H.f);r.hf=H.f}
  return r;
};
var _planSig=planSig;
planSig=function(){return _planSig()+'|'+legs.map(function(l){return (l.rate||'')+(l.tripRate||'')}).join('')+'|'+catches.map(function(c){return c.id+':'+fishCount(c)}).join(',')};

/* ---------- confianza ---------- */
function confLvl(n,sim){var l=n>=7?3:n>=3?2:n>=1?1:0;if(n>0&&sim===0)l=Math.min(l,1);return l}
var CONFN=['Sin datos','Intuición','Fiable','Sólido'];
function confTip(n,sim,what){return CONFN[confLvl(n,sim)]+': '+n+(n===1?' salida':' salidas')+(what?' '+what:'')+(n&&sim!=null?(sim?', '+sim+' con condiciones parecidas':', ninguna con condiciones parecidas'):'')}
function confDots(n,sim,what){var l=confLvl(n,sim);return '<span class="conf c'+l+'" title="'+esc(confTip(n,sim,what))+'" aria-label="'+esc(confTip(n,sim,what))+'"><i></i><i></i><i></i></span>'}
function confLine(ev,what){
  if(!ev)return '';

  if(!ev.n)t='Sin salidas apuntadas '+(what||'aquí')+': es una estimación genérica.';
  else if(ev.sim==null)t=ev.n+(ev.n===1?' salida':' salidas')+' '+(what||'')+'.';
  else if(!ev.sim)t=ev.n+(ev.n===1?' salida':' salidas')+' '+(what||'')+', ninguna con condiciones parecidas a estas.';
  else t=ev.n+(ev.n===1?' salida':' salidas')+' '+(what||'')+', '+ev.sim+(ev.sim===1?' con condiciones parecidas.':' con condiciones parecidas.');
  return '<div class="evl c'+l+'">'+confDots(ev.n,ev.sim,what)+'<span><b>'+CONFN[l]+'</b> · '+esc(t)+'</span></div>';
}
function evidOf(ES,c){
  var tr={},sm={};
  ES.forEach(function(E){(E.M.R||[]).forEach(function(r){tr[r.l.tripId]=1;if(c&&legSim(r.l,c)>=0.35)sm[r.l.tripId]=1})});

var _planFor=planFor;
planFor=function(iso){

    P.G.forEach(function(G){
      var act=G.spots.filter(function(E){return !E.pending}), ES=G.route&&G.route.length?G.route.map(function(x){return x.E}).filter(function(e,i,a){return a.indexOf(e)===i}):act;
      var c=G.best&&P.C?condAt(P,(G.best.from+G.best.to)/2):null;

/* ---------- especies: qué condiciones le van a cada una ---------- */
function moonF(d){var jd=d.getTime()/86400000+2440587.5;return (((jd-2451550.1)/29.530588853)%1+1)%1}
function moonQ(f){return f<0.125||f>=0.875?'nueva':f<0.375?'creciente':f<0.625?'llena':'menguante'}
var MOONQ={nueva:'Luna nueva',creciente:'Creciente',llena:'Luna llena',menguante:'Menguante'};
function speciesObs(){
  var map={};
  legs.forEach(function(l){
    catchesOfLeg(l).forEach(function(c){(c.items||[]).forEach(function(i){
      if(!i.species||!(i.n>0))return;
      var k=norm(i.species), m=map[k]||(map[k]={k:k,name:i.species,fish:0,obs:[]});
      m.fish+=i.n;
      var o=m.obs.filter(function(x){return x.l===l})[0];
      if(o)o.n+=i.n;
      else m.obs.push({l:l,n:i.n,date:l.date,spotId:l.spotId,wave:l.wave,wind:l.wind,h:legMid(l),hr:legHour(l),ph:l.tpFrom,range:l.range,mq:l.date?moonQ(moonF(dateOf(l.date))):null});
    })});
  });

}
function obsSim(o,c,hr){
  var w=1,k=0;

  if(o.wind!=null&&c.wind!=null){w*=gk(o.wind-c.wind,8);k++}
  if(o.h!=null&&c.h!=null){w*=gk(o.h-c.h,0.6);k++}
  if(o.hr!=null&&hr!=null){var d=Math.abs(o.hr-hr);d=Math.min(d,24-d);w*=gk(d,2.5);k++}

function speciesFor(spotIds,c,hr,max){

    var m=SO[k], here=m.obs.filter(function(o){return spotIds.indexOf(o.spotId)>-1});
    if(!here.length)return;
    var r=speciesFit(here,c,hr);
    if(r.fit>=0.3)out.push({m:m,fit:r.fit,sim:r.sim,here:here.length,bait:topBaitFor(m.k,spotIds)});
  });
  out.sort(function(a,b){return b.fit-a.fit});

function spKeyOf(m){var a=SPECIES.filter(function(s){return norm(s.n)===m.k})[0];return a?a.k:'x-'+m.k}

function qtl(a,p){a=a.slice().sort(function(x,y){return x-y});var i=(a.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return a[lo]+(a[hi]-a[lo])*(i-lo)}

function hourStrip(hrs){

function countTop(a){var m={};a.forEach(function(x){if(x)m[x]=(m[x]||0)+1});return Object.keys(m).map(function(k){return [k,m[k]]}).sort(function(x,y){return y[1]-x[1]})}

    (sl.length?'<p class="spk"><small>Dónde</small> '+sl.join(' · ')+'</p>':'')+

function pad2(n){return String(n).padStart(2,'0')}
function hvM(a,b,c,d){var r=Math.PI/180,dl=(c-a)*r,dn=(d-b)*r,x=Math.pow(Math.sin(dl/2),2)+Math.cos(a*r)*Math.cos(c*r)*Math.pow(Math.sin(dn/2),2);return 12742000*Math.asin(Math.sqrt(x))}
function nearestSpot(lat,lon,max){
  var best=null;
  if(lat==null)return null;
  spots.forEach(function(s){if(s.lat==null)return;var d=hvM(lat,lon,s.lat,s.lon);if(d<=max&&(!best||d<best.d))best={s:s,d:d}});
  return best;
}
function nearestSite(lat,lon,max){
  var best=null;if(lat==null)return null;
  sites.forEach(function(st){var p=null;try{p=sitePos(st)}catch(e){}if(!p)return;var d=Math.min.apply(null,(p.pts&&p.pts.length?p.pts:[[p.la,p.lo]]).map(function(q){return hvM(lat,lon,q[0],q[1])}));if(d<=max&&(!best||d<best.d))best={s:st,d:d}});
  return best;
}
function lastCaptureLoc(){
  var best=null,now=Date.now();
  catches.forEach(function(c){
    var t=c.ts||c.createdAt||0, la=c.lat, lo=c.lon, sp=c.spotId?spots.filter(function(x){return x.id===c.spotId})[0]:null;
    if(la==null&&sp){la=sp.lat;lo=sp.lon}
    if(la==null||now-t>12*3600000)return;
    if(!best||t>best.t)best={t:t,lat:la,lon:lo,spotId:c.spotId||null,name:sp?sp.name:null};
  });
  return best;
}
function qcRadius(){return Math.max(35,Math.min(QC&&QC.acc||0,80))}
function recentSpecies(){
  var out=[],seen={};
  catches.slice().sort(function(a,b){return (b.createdAt||0)-(a.createdAt||0)}).forEach(function(c){(c.items||[]).forEach(function(i){var k=norm(i.species);if(i.species&&!seen[k]&&out.length<8){seen[k]=1;out.push({n:i.species,k:i.key||null})}})});
  if(out.length<6){var st=speciesStats();Object.keys(st).sort(function(a,b){return st[b].n-st[a].n}).forEach(function(k){if(!seen[k]&&out.length<8){seen[k]=1;out.push({n:st[k].name,k:null})}})}
  if(out.length<4)['Lubina','Sargo','Dorada','Boga','Lisa','Maragota'].forEach(function(n){var k=norm(n);if(!seen[k]&&out.length<6){seen[k]=1;out.push({n:n,k:null})}});
  return out;
}
function keyOfName(n){var a=SPECIES.filter(function(s){return norm(s.n)===norm(n)})[0];return a?a.k:null}

    baitQuickRow()+

    '<div class="field"><label for="qc-spot">Dónde</label><select id="qc-spot">'+spotOpts+'</select></div>';

function qcWhere(){
  var q=QC; if(!q)return {txt:'',cls:''};
  if(q.sel==='none')return {txt:'📍 Sin ubicación',cls:'off'};
  if(q.sel){var sp=spots.filter(function(s){return s.id===q.sel})[0];return {txt:'📍 '+(sp?sp.name:'Spot'),cls:'ok'}}
  if(q.fromLast&&q.lat!=null){
    var ln=q.fromLast.spotId?(spots.filter(function(s){return s.id===q.fromLast.spotId})[0]||null):nearestSpot(q.lat,q.lon,35)&&nearestSpot(q.lat,q.lon,35).s;
    var ago=Math.max(1,Math.round((Date.now()-q.fromLast.t)/60000));
    return {txt:'📍 Como la última captura'+(ln?' · '+ln.name:'')+' · hace '+(ago<90?ago+' min':Math.round(ago/60)+' h')+(q.gps==='wait'?' (buscando GPS…)':''),cls:'new',spot:ln};
  }
  if(q.lat!=null){
    var n=nearestSpot(q.lat,q.lon,qcRadius());
    var base=q.manual?'Marcado a mano':q.acc!=null?'±'+q.acc+' m':'';
    return {txt:'📍 '+(n?'Cerca de '+n.s.name:'Punto nuevo')+(base?' · '+base:''),cls:n?'ok':'new',spot:n&&n.s};
  }
  if(q.gps==='fail')return {txt:'📍 Sin GPS — elige spot o marca en el mapa',cls:'off'};
  return {txt:'📍 Localizando…',cls:'wait'};
}

}
function qcFoot(){return '<button class="btn" data-a="qc-save-more" id="qc-more">Guardar y otra</button><button class="btn primary" data-a="qc-save" id="qc-ok">Guardar</button>'}
function qcPaint(){var el=$('#qc-body');if(el){el.innerHTML=quickBody();qcStat()}}
function qcNow(){var d=new Date();return {ts:d.getTime(),date:todayISO(),time:pad2(d.getHours())+':'+pad2(d.getMinutes())}}
function qcFix(p){if(!QC||QC.manual)return;QC.fromLast=null;QC.lat=p.coords.latitude;QC.lon=p.coords.longitude;QC.acc=Math.round(p.coords.accuracy||0);QC.gps='ok';qcStat()}
function qcErr(){if(!QC)return;if(QC.gps!=='ok')QC.gps='fail';qcStat()}
function qcStart(){

    navigator.geolocation.getCurrentPosition(qcFix,qcErr,{enableHighAccuracy:true,timeout:15000,maximumAge:10000});
    QCW=navigator.geolocation.watchPosition(qcFix,function(){},{enableHighAccuracy:true,maximumAge:5000,timeout:30000});
  }catch(e){qcErr()}
}

async function qcSave(more){

  var b1=$('#qc-ok'),b2=$('#qc-more');if(b1)b1.disabled=true;if(b2)b2.disabled=true;

  if(q.sel==='none'){lat=null;lon=null;acc=null}
  else if(q.sel){spotId=q.sel;var sp=spots.filter(function(s){return s.id===q.sel})[0];if(sp&&lat==null){lat=sp.lat;lon=sp.lon}}
  else if(q.fromLast&&lat!=null){spotId=q.fromLast.spotId||(nearestSpot(lat,lon,35)||{s:{}}).s.id||null}
  else if(lat!=null){var nr=nearestSpot(lat,lon,qcRadius());if(nr)spotId=nr.s.id}
  var item={species:q.species,key:q.key||keyOfName(q.species),n:q.n,size:q.size,st:q.st};if(q.bait)item.bait=q.bait;if(q.who)item.who=q.who;if(typeof sessCur==='function'&&sessCur()&&sessCur().curEq)item.eq=sessCur().curEq;if(q.hook&&q.hook.trim())item.hook=q.hook.trim();
  var doc={quick:true,date:q.date,time:q.time,ts:q.ts,lat:lat,lon:lon,acc:acc,spotId:spotId,photos:[],notes:'',createdAt:Date.now(),locSrc:lat==null?null:q.sel?'spot':q.manual?'manual':q.fromLast?'last':'gps',items:[item]};if(typeof sessCur==='function'&&sessCur())doc.sess=sessCur().id;
  try{
    var ref=db.collection('catches').doc(); await ref.set(doc);
    var sn=spotId?(spots.filter(function(s){return s.id===spotId})[0]||{}).name:null;
    toast(q.species+' '+q.size+(q.n>1?' ×'+q.n:'')+' guardada · '+q.time+(sn?' · '+sn:lat!=null?' · punto nuevo':' · sin ubicación'));
    if(lat==null&&q.sel!=='none')qcLate(ref.id);
    if(more){var n=qcNow();q.ts=n.ts;q.date=n.date;q.time=n.time;q.species='';q.key=null;q.n=1;q.size='M';q.st='casa';if(b1)b1.disabled=false;if(b2)b2.disabled=false;qcPaint()}
    else{qcStop();QC=null;closeSheet()}
  }catch(e){if(b1)b1.disabled=false;if(b2)b2.disabled=false;toast('No se pudo guardar la captura')}
}

      try{await db.doc('catches/'+id).update({lat:la,lon:lo,acc:Math.round(p.coords.accuracy||0),spotId:nr?nr.s.id:null,geoLate:true})}catch(e){}

/* ---------- ordenar: convertir en salida ---------- */
function qcOrder(date){
  var Q=quickList().filter(function(c){return c.date===date}).sort(function(a,b){return (a.ts||0)-(b.ts||0)});
  if(!Q.length)return;
  openTripEditor(null);
  var d=tripDraft; if(!d)return;
  d.date=date;
  var cl=[];
  Q.forEach(function(c){
    var k=cl.filter(function(x){return c.spotId?x.spotId===c.spotId:(!x.spotId&&c.lat!=null&&x.lat!=null&&hvM(x.lat,x.lon,c.lat,c.lon)<=40)})[0];
    if(!k){k={spotId:c.spotId||'',lat:c.lat,lon:c.lon,cs:[]};cl.push(k)}
    k.cs.push(c);if(k.lat==null&&c.lat!=null){k.lat=c.lat;k.lon=c.lon}
  });
  d.stops=[];d.items=[];
  cl.forEach(function(k){
    var sp=k.spotId?spots.filter(function(s){return s.id===k.spotId})[0]:null;
    var t0=k.cs[0].time||'', t1=k.cs[k.cs.length-1].time||'';
    var kb=[];k.cs.forEach(function(c){(c.items||[]).forEach(function(it){if(it.bait&&kb.indexOf(it.bait)<0)kb.push(it.bait)})});
    var st=newStop({baits:kb,spotId:k.spotId,name:sp?sp.name:'',lat:sp?sp.lat:k.lat,lon:sp?sp.lon:k.lon,tFrom:t0,tTo:t1!==t0?t1:'',desc:sp?sp.notes||'':'',descOrig:sp?sp.notes||'':''});
    d.stops.push(st);
    k.cs.forEach(function(c){(c.items||[]).forEach(function(it){d.items.push(Object.assign({},it,{stopId:st.id,spotId:k.spotId||null}))})});
  });
  var site=null, f0=cl[0];
  if(f0.spotId){var sp0=spots.filter(function(s){return s.id===f0.spotId})[0];if(sp0&&sp0.siteId)site=siteOf(sp0.siteId)}
  if(!site){var ns=nearestSite(f0.lat,f0.lon,600);if(ns)site=ns.s}
  if(site){d.siteId=site.id;d.siteName=site.name;d.siteLat=site.lat;d.siteLon=site.lon;d.siteDesc=site.desc||'';d.siteDescOrig=site.desc||'';d.newSite=false;d.step=1}
  else d.step=0;
  d.fromQuick=Q.map(function(c){return c.id});
  d.stops.forEach(function(s,i){try{fillStopFromForecast(i,true)}catch(e){}});
  renderStep();
  toast(Q.length+(Q.length===1?' captura pasada':' capturas pasadas')+' a la salida: añade lo que falte y guarda');
}
