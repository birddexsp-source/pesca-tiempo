function qcSpotMake(id){
  var c=catches.filter(function(x){return x.id===id})[0]; if(!c||c.lat==null)return;
  var ns=nearestSite(c.lat,c.lon,600);
  QS={id:id,siteId:ns?ns.s.id:''};
  var opts='<option value="">(sin sitio)</option>'+sites.slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name),'es')}).map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===QS.siteId?' selected':'')+'>'+esc(s.name)+'</option>'}).join('');
  var near=quickList().filter(function(x){return !x.spotId&&x.lat!=null&&hvM(c.lat,c.lon,x.lat,x.lon)<=40}).length;
  openSheet('Hacer spot','<div class="block"><p class="hint">Se crea un spot en el punto donde pescaste ('+c.lat.toFixed(5)+', '+c.lon.toFixed(5)+')'+(near>1?' y se le asignan las '+near+' capturas rápidas de ese punto':'')+'. Luego puedes editarlo en Mapa.</p><div class="field"><label for="qs-name">Nombre</label><input id="qs-name" maxlength="80" placeholder="Ej. Roca de la izquierda"></div><div class="field"><label for="qs-site">Sitio</label><select id="qs-site">'+opts+'</select></div></div>','<button class="btn" data-a="close-sheet">Cancelar</button><button class="btn primary" data-a="qs-save" id="qs-save">Crear spot</button>');
}
async function qsSave(){
  var c=QS&&catches.filter(function(x){return x.id===QS.id})[0]; if(!c)return;
  var nm=($('#qs-name').value||'').trim(); if(!nm){toast('Ponle nombre al spot');return}
  var siteId=$('#qs-site').value||null, btn=$('#qs-save'); btn.disabled=true;
  try{
    var ref=db.collection('spots').doc();
    await ref.set({name:nm,siteId:siteId,lat:c.lat,lon:c.lon,notes:'',createdAt:Date.now()});
    var Q=quickList().filter(function(x){return !x.spotId&&x.lat!=null&&hvM(c.lat,c.lon,x.lat,x.lon)<=40});
    for(var i=0;i<Q.length;i++)await db.doc('catches/'+Q[i].id).update({spotId:ref.id});

/* ================= CEBOS ================= */
var BAITS_NAT=['Gamba arrocera','Gamba blanca','Langostino','Mejillón','Sardina','Caballa','Anchoa','Chipirón','Calamar','Sepia','Cangrejo','Lombriz','Gusana','Lapa','Navaja'];
var BAITS_ART=['Vinilo','Jig','Minnow','Vibrador','Cucharilla','Popper','Plumas'];
function usedBaits(){
  var m={};
  var add=function(n,t){if(!n)return;var k=norm(n);if(!m[k])m[k]={n:n,t:0};if(t>m[k].t)m[k].t=t};
  catches.forEach(function(c){(c.items||[]).forEach(function(i){add(i.bait,c.ts||c.createdAt||0)})});
  trips.forEach(function(t){(t.stops||[]).forEach(function(s){(s.baits||[]).forEach(function(b){add(b,t.createdAt||0)})})});
  return m;
}
var ART_RX=/vinil|jig|minnow|se[ñn]uelo|cucharilla|popper|shad|vibr|pluma|paseante|stick|crank|rapala|lipless|spoon|spinner|goma|metal|pez artificial|r[ií]gido/i;
function isArtBait(n){return BAITS_ART.map(norm).indexOf(norm(n))>-1||ART_RX.test(n)}
function allBaits(){
  var u=usedBaits(), known={}, out=[], outA=[];
  BAITS_NAT.concat(BAITS_ART).forEach(function(n){known[norm(n)]=1});
  Object.keys(u).forEach(function(k){if(!known[k])(isArtBait(u[k].n)?outA:out).push(u[k].n)});
  return {nat:BAITS_NAT.concat(out.sort()),art:BAITS_ART.concat(outA.sort())};
}

/* --- estadísticas --- */
function legOfItem(c,i){
  if(!c.tripId)return null;
  var ls=legs.filter(function(l){return l.tripId===c.tripId});
  var sid=i.stopId!=null?String(i.stopId):(c.stopId!=null?String(c.stopId):null);
  return (sid!=null?ls.filter(function(l){return l.stopId===sid})[0]:null)||(ls.length===1?ls[0]:null);
}
function baitStats(){
  var S={};
  var g=function(n){var k=norm(n);return S[k]||(S[k]={k:k,n:n,fish:0,sp:{},spots:{},outs:{},mins:0,legsUsed:0})};
  legs.forEach(function(l){
    var bs=l.baits||[]; if(!bs.length)return;
    var a=hm(l.tFrom),b=hm(l.tTo), mins=a!=null&&b!=null&&b>a?b-a:0;
    bs.forEach(function(n){var x=g(n);x.legsUsed++;x.outs[l.tripId]=1;x.mins+=mins/bs.length});
  });
  catches.forEach(function(c){(c.items||[]).forEach(function(i){
    var l=legOfItem(c,i), bait=i.bait||(l&&l.baits&&l.baits.length===1?l.baits[0]:null);
    if(!bait||!(i.n>0))return;
    var x=g(bait);x.fish+=i.n;var sp=norm(i.species);x.sp[sp]=(x.sp[sp]||0)+i.n;if(!x.spn)x.spn={};x.spn[sp]=i.species;
    var sid=i.spotId||(l&&l.spotId)||c.spotId;if(sid)x.spots[sid]=(x.spots[sid]||0)+i.n;
    x.outs[c.tripId||('d'+c.date)]=1;
  })});
  return S;
}
function topBaitFor(spKey,spotIds){
  var best=null,c={};
  catches.forEach(function(ct){(ct.items||[]).forEach(function(i){
    if(norm(i.species)!==spKey||!(i.n>0))return;
    var l=legOfItem(ct,i), b=i.bait||(l&&l.baits&&l.baits.length===1?l.baits[0]:null); if(!b)return;
    var sid=i.spotId||(l&&l.spotId)||ct.spotId, w=i.n*((spotIds&&sid&&spotIds.indexOf(sid)>-1)?2:1);
    c[b]=(c[b]||0)+w;
  })});
  Object.keys(c).forEach(function(b){if(!best||c[b]>c[best])best=b});
  return best;
}

    var poW=ls.filter(function(l){return l.waveV==='poco'&&l.wave!=null&&l.wave!==''}).map(function(l){return +l.wave});
    var fl=null;
    if(okW.length)fl=Math.max(0,Math.min.apply(null,okW)-0.15);
    if(poW.length)fl=Math.max(fl==null?0:fl,Math.max.apply(null,poW)+0.05);

  if(T.lo==null&&T.hi!=null){T.lo=Math.round(T.hi*0.45*100)/100;T.estLo=true;est=true}
  M.K.wave=e.minWave!=null||e.maxWave!=null; M.K.tide=T.lo!=null||T.hi!=null;

recentSpecies=function(){
  var tot={},loc={},name={},key={},la=QC&&QC.lat,lo=QC&&QC.lon,sid=QC&&(QC.sel||(QC.fromLast&&QC.fromLast.spotId)||null);
  catches.forEach(function(c){

    (c.items||[]).forEach(function(i){
      if(!i.species)return; var k=norm(i.species), n=i.n||1;

    });
  });

  var out=ks.slice(0,8).map(function(k){return {n:name[k],k:key[k]||null}}), seen={};

function compGet(name){
  name=String(name||'').trim();if(!name)return null;
  var c=COMPS.filter(function(x){return norm(x.name)===norm(name)})[0];if(c)return c;
  var ref=db.collection('companeros').doc();c={id:ref.id,name:name};COMPS.push(c);
  ref.set({name:name,createdAt:Date.now()}).catch(function(){toast('No se pudo guardar el compañero')});return c;
}
function modeNames(){return (typeof MODOS!=='undefined'?MODOS.map(function(m){return m.n}):MODES).filter(function(n){return n!=='Solo mirar el mar'})}

function sessFinish(){
  var s=SESS;if(!s)return;
  var q=quickList().filter(function(c){return c.date===s.date&&c.sess===s.id});
  db.doc('sesiones/activa').delete().catch(function(){});
  SESS=null;COMPUI=false;COMPT='draft';closeSheet();sessPaint();
  if(q.length)qcOrder(s.date);else openTripEditor(null);
  var d=tripDraft;if(!d)return;
  d.date=s.date;if(s.mode)d.mode=s.mode;d.companions=(s.companions||[]).map(function(c){return {id:c.id,name:c.name,mode:c.mode||''}});
  if(s.siteId){var st=siteOf(s.siteId);if(st){d.siteId=st.id;d.siteName=st.name;d.siteLat=st.lat;d.siteLon=st.lon;d.siteDesc=st.desc||'';d.siteDescOrig=st.desc||''}}
  d.fromSess=true;renderStep();

/* ---------- pantalla Compañeros ---------- */
function compStats(){
  var R={};
  COMPS.forEach(function(c){R[c.id]={id:c.id,name:c.name,trips:[],me:0,he:0,sp:{},meSp:{},heSp:{}}});
  trips.forEach(function(t){
    (t.companions||[]).forEach(function(c){
      var r=R[c.id]||(R[c.id]={id:c.id,name:c.name,trips:[],me:0,he:0,sp:{},meSp:{},heSp:{}});
      var m=0,h=0;
      catches.filter(function(x){return x.tripId===t.id}).forEach(function(x){(x.items||[]).forEach(function(i){
        if(i.st==='esc')return;var n=+i.n||0;
        if(i.who===c.id){h+=n;r.heSp[i.species]=(r.heSp[i.species]||0)+n}
        else if(!i.who){m+=n;r.meSp[i.species]=(r.meSp[i.species]||0)+n}
      })});
      r.me+=m;r.he+=h;r.trips.push({t:t,me:m,he:h,mode:c.mode||''});
    });
  });
  return R;
}

function lvRigTxt(r){if(!r)return '';var n=(r.used||[]).map(function(u){return u.name+(u.bob?' ('+u.bob+')':'')});if(n.length)return n.join(' · ');try{return eqPillsArr(r).join(' · ')}catch(e){return ''}}

/* ---------- grabadora ---------- */
function recHTML(){
  if(REC&&REC.on)return '<div class="recbox on"><span class="rdot"></span><b id="rectime">0:00</b><button type="button" class="btn primary" data-a="lv-rec">Parar</button></div>';
  if(LA&&LA.url)return '<div class="recbox"><audio controls src="'+LA.url+'"></audio><button type="button" class="btn small" data-a="lv-rec-del">Quitar</button></div>';
  return '<div class="recbox"><button type="button" class="btn" data-a="lv-rec">🎙 Grabar nota de voz</button><small class="hint">En vez de escribir. Luego en casa la pasamos a texto.</small></div>';
}
function recToggle(){
  if(REC&&REC.on){try{REC.mr.stop()}catch(e){}return}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast('Este navegador no puede grabar audio');return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    var mr=new MediaRecorder(st),ch=[];REC={mr:mr,on:true,t0:Date.now()};
    mr.ondataavailable=function(e){if(e.data&&e.data.size)ch.push(e.data)};
    mr.onstop=function(){
      try{st.getTracks().forEach(function(t){t.stop()})}catch(e){}
      var type=mr.mimeType||'audio/webm',bl=new Blob(ch,{type:type});
      clearInterval(REC.iv);REC.on=false;
      LA=bl.size?{blob:bl,url:URL.createObjectURL(bl),type:type}:null;lvPaint();
    };
    mr.start();
    REC.iv=setInterval(function(){var el=document.getElementById('rectime');if(el){var s=Math.round((Date.now()-REC.t0)/1000);el.textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2)}},400);
    lvPaint();
  }).catch(function(){toast('Sin permiso de micrófono')});
}
function recStopHard(){if(REC&&REC.on){try{REC.mr.onstop=null;REC.mr.stop()}catch(e){}clearInterval(REC.iv);REC.on=false}LA=null}
function lvUpAudio(){
  if(!LA||!LA.blob)return Promise.resolve(null);
  return window.claude.use('assets').then(function(a){return a.upload(LA.blob,{type:LA.type})}).then(function(r){return r&&r.id||null}).catch(function(){return null});
}

window.addEventListener('click',function(ev){

  return sites.slice().sort(function(a,b){var x=order.indexOf(a.id),y=order.indexOf(b.id);if(x<0)x=999;if(y<0)y=999;return x-y||String(a.name).localeCompare(String(b.name),'es')});
}

/* ===== p54: Semáforo por spot y día — tus «No ir si…» cruzados con la previsión ===== */
function smRules(s){
  var L=spotLearn(s),R={wind:null,waveHi:null,waveLo:null,tideHi:null,tideLo:null,src:{}},ls=legsOfSpot(s.id);
  function leg(f){return ls.filter(f).sort(function(a,b){return String(a.date).localeCompare(String(b.date))})[0]||null}
  if(L.windTooMuch!=null){R.wind=L.windTooMuch;R.src.wind=leg(function(l){return l.windV==='mucho'&&l.wind===L.windTooMuch})}
  if(L.tooHigh!=null){R.waveHi=L.tooHigh;R.src.waveHi=leg(function(l){return l.waveV==='mucho'&&l.wave===L.tooHigh})}
  if(L.tooLow!=null){R.waveLo=L.tooLow;R.src.waveLo=leg(function(l){return l.waveV==='poco'&&l.wave===L.tooLow})}
  var hi=[],lo=[];
  ls.forEach(function(l){if(l.hA==null)return;var b=l.hB!=null?l.hB:l.hA;if(l.tideV==='mucho')hi.push({v:Math.min(l.hA,b),l:l});if(l.tideV==='poco')lo.push({v:Math.max(l.hA,b),l:l})});
  if(hi.length){hi.sort(function(a,b){return a.v-b.v});R.tideHi=hi[0].v;R.src.tideHi=hi[0].l}
  if(lo.length){lo.sort(function(a,b){return b.v-a.v});R.tideLo=lo[0].v;R.src.tideLo=lo[0].l}
  R.any=R.wind!=null||R.waveHi!=null||R.waveLo!=null||R.tideHi!=null||R.tideLo!=null;
  return R;
}
function smSlot(R,c){

    if(v==null||lim==null)return;
    if(up?v>=lim:v<=lim)br.push(k);else if(up?v>=lim-mg:v<=lim+mg)near=true;
  }
  chk('wind',c.wind,R.wind,true,3);chk('waveHi',c.wave,R.waveHi,true,0.15);chk('waveLo',c.wave,R.waveLo,false,0.15);
  chk('tideHi',c.h,R.tideHi,true,0.1);chk('tideLo',c.h,R.tideLo,false,0.1);

}
function smVisit(l){if(!l||!l.date)return '';var p=dparts(l.date);return 'en la visita del '+p.d+' '+p.m}
function smEval(s,P){
  var R=smRules(s);
  if(!R.any)return {st:'nd',txt:'Sin datos: aún no has valorado ninguna visita aquí.'};
  var cs=P.C.filter(function(c){return c.light===1}),g=[],cnt={},amb=0,run=null,best=null;
  cs.forEach(function(c){
    var r=smSlot(R,c);
    if(r.br.length){r.br.forEach(function(k){cnt[k]=(cnt[k]||0)+1});if(run){if(!best||run[1]-run[0]>best[1]-best[0])best=run;run=null}}
    else{if(r.near)amb++;g.push(c);if(!run)run=[c.m,c.m+10];else run[1]=c.m+10}
  });
  if(run&&(!best||run[1]-run[0]>best[1]-best[0]))best=run;
  var ok=g.length;
  var top=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a]})[0];
  function why(){
    if(!top)return '';
    var vals=cs.map(function(c){return top.indexOf('wind')===0?c.wind:top.indexOf('wave')===0?c.wave:c.h}).filter(function(v){return v!=null});
    var lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),src=R.src[top],u=top.indexOf('wind')===0?'kph':'m',d=top==='wind'?0:top.indexOf('tide')===0?2:1;
    var rng=Math.abs(hi-lo)<0.05?num(hi,d):num(lo,d)+'–'+num(hi,d);
    var lim={wind:R.wind,waveHi:R.waveHi,waveLo:R.waveLo,tideHi:R.tideHi,tideLo:R.tideLo}[top];
    var nm={wind:'viento',waveHi:'ola',waveLo:'ola',tideHi:'agua',tideLo:'agua'}[top];
    var sv=src?' '+smVisit(src)+' con '+num(lim,d)+' '+u+(top==='wind'?' no se podía lanzar':top==='waveHi'?' había demasiada':top==='waveLo'?' había poca':top==='tideHi'?' el agua estaba demasiado alta':' el agua estaba muy baja'):'';
    return nm+' '+rng+' '+u+(sv?'; '+sv:'');
  }
  var w=best&&best[1]-best[0]>=30?mm(best[0])+'–'+mm(best[1]):'';
  if(ok>=6&&!top)return {st:amb>ok*0.5?'am':'ok',txt:(amb>ok*0.5?'Al límite de tu receta':'Encaja con tu receta')+(w?' · '+w:'')};
  if(ok>=6)return {st:'am',txt:'Solo parte del día encaja'+(w?' ('+w+')':'')+' · '+why()};
  if(ok>=3)return {st:'am',txt:'Al límite'+(w?' ('+w+')':'')+' · '+why()};
  return {st:'rj',txt:why()||'Fuera de tu receta'};
}

function mdEval(H){

function mdDayShort(iso){var p=dparts(iso);return dayLabel(iso).slice(0,3)+' '+p.d}
function mdUnits(P){
  /* un «sitio» = su grupo de spots; los spots sin sitio van cada uno por su cuenta */
  var out=[];
  P.G.forEach(function(G){
    if(G.onlyPending)return;
    if(G.site)out.push({name:G.name,site:G.site,spots:G.spots});
    else G.spots.forEach(function(E){if(!E.pending)out.push({name:E.s.name,site:null,spots:[E]})});
  });

}
function mdSite(P,U){
  /* puntúa el sitio entero: en cada hora cuenta el mejor de sus spots aptos; ordena los spots por hora */
  var ok=[],rj=[],i;
  U.spots.forEach(function(E){
    if(E.pending)return;
    var sm=smEval(E.s,P);
    if(sm.st==='rj'){rj.push({E:E,txt:sm.txt});return}
    var k=sm.st==='am'?0.85:sm.st==='nd'?0.8:1;
    ok.push(Object.assign({},E,{v:E.v.map(function(x){return x==null?null:x*k}),orig:E,sm:sm}));
  });
  if(!ok.length)return {rj:rj,none:true};
  var v=P.C.map(function(c,j){var mx=null;ok.forEach(function(E){if(E.v[j]!=null&&(mx==null||E.v[j]>mx))mx=E.v[j]});return mx});
  var best=bestOf(winsOf(v,0.55,3));
  if(!best)return {rj:rj,ok:ok,none:true};
  var route=routeOf(ok,best).map(function(r){return {E:r.E.orig,sm:r.E.sm,from:r.from,to:r.to,avg:r.avg,sum:r.avg*(r.to-r.from)}});
  var lead=route.slice().sort(function(a,b){return b.sum-a.sum})[0];
  var open=ok.filter(function(E){var m=0;for(var j=best.a;j<best.b;j++)if(E.v[j]!=null&&E.v[j]>m)m=E.v[j];return m>=0.5}).map(function(E){return E.orig});
  return {rj:rj,ok:ok,best:best,route:route,lead:lead.E,sm:lead.sm,n:ok.length,open:open,total:ok.length+rj.length};
}
/* experiencia del sitio: hasta dónde has pescado (ola y viento) y hasta dónde no */
function mdMin(a,b){return a==null?b:b==null?a:Math.min(a,b)}

  }catch(e){}
