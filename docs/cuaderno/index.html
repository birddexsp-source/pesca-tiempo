  if(!db){toast('No se puede guardar sin sesión');return}
  var b1=$('#qc-ok'),b2=$('#qc-more');if(b1)b1.disabled=true;if(b2)b2.disabled=true;
  var lat=q.lat,lon=q.lon,spotId=null,acc=q.acc;
  if(q.sel==='none'){lat=null;lon=null;acc=null}
  else if(q.sel){spotId=q.sel;var sp=spots.filter(function(s){return s.id===q.sel})[0];if(sp&&lat==null){lat=sp.lat;lon=sp.lon}}
  else if(q.fromLast&&lat!=null){spotId=q.fromLast.spotId||(nearestSpot(lat,lon,35)||{s:{}}).s.id||null}
  else if(lat!=null){var nr=nearestSpot(lat,lon,qcRadius());if(nr)spotId=nr.s.id}
  var item={species:q.species,key:q.key||keyOfName(q.species),n:q.n,size:q.size,st:q.st};if(q.bait)item.bait=q.bait;if(q.hook&&q.hook.trim())item.hook=q.hook.trim();
  var doc={quick:true,date:q.date,time:q.time,ts:q.ts,lat:lat,lon:lon,acc:acc,spotId:spotId,photos:[],notes:'',createdAt:Date.now(),locSrc:lat==null?null:q.sel?'spot':q.manual?'manual':q.fromLast?'last':'gps',items:[item]};
  try{
    var ref=db.collection('catches').doc(); await ref.set(doc);
    var sn=spotId?(spots.filter(function(s){return s.id===spotId})[0]||{}).name:null;
    toast(q.species+' '+q.size+(q.n>1?' ×'+q.n:'')+' guardada · '+q.time+(sn?' · '+sn:lat!=null?' · punto nuevo':' · sin ubicación'));
    if(lat==null&&q.sel!=='none')qcLate(ref.id);
    if(more){var n=qcNow();q.ts=n.ts;q.date=n.date;q.time=n.time;q.species='';q.key=null;q.n=1;q.size='M';q.st='casa';if(b1)b1.disabled=false;if(b2)b2.disabled=false;qcPaint()}
    else{qcStop();QC=null;closeSheet()}
  }catch(e){if(b1)b1.disabled=false;if(b2)b2.disabled=false;toast('No se pudo guardar la captura')}
}
function qcLate(id){

    navigator.geolocation.getCurrentPosition(async function(p){
      var la=p.coords.latitude,lo=p.coords.longitude,nr=nearestSpot(la,lo,Math.max(35,Math.min(p.coords.accuracy||0,80)));
      try{await db.doc('catches/'+id).update({lat:la,lon:lo,acc:Math.round(p.coords.accuracy||0),spotId:nr?nr.s.id:null,geoLate:true})}catch(e){}
    },function(){},{enableHighAccuracy:true,timeout:45000,maximumAge:60000});
  }catch(e){}
}

/* ---------- ordenar: convertir en salida ---------- */
function qcOrder(date){
  var Q=quickList().filter(function(c){return c.date===date}).sort(function(a,b){return (a.ts||0)-(b.ts||0)});
  if(!Q.length)return;
  openTripEditor(null);
  var d=tripDraft; if(!d)return;
  d.date=date;
  var cl=[];
  Q.forEach(function(c){
    var k=cl.filter(function(x){return c.spotId?x.spotId===c.spotId:(!x.spotId&&c.lat!=null&&x.lat!=null&&hvM(x.lat,x.lon,c.lat,c.lon)<=40)})[0];
    if(!k){k={spotId:c.spotId||'',lat:c.lat,lon:c.lon,cs:[]};cl.push(k)}
    k.cs.push(c);if(k.lat==null&&c.lat!=null){k.lat=c.lat;k.lon=c.lon}
  });
  d.stops=[];d.items=[];
  cl.forEach(function(k){
    var sp=k.spotId?spots.filter(function(s){return s.id===k.spotId})[0]:null;
    var t0=k.cs[0].time||'', t1=k.cs[k.cs.length-1].time||'';
    var kb=[];k.cs.forEach(function(c){(c.items||[]).forEach(function(it){if(it.bait&&kb.indexOf(it.bait)<0)kb.push(it.bait)})});
    var st=newStop({baits:kb,spotId:k.spotId,name:sp?sp.name:'',lat:sp?sp.lat:k.lat,lon:sp?sp.lon:k.lon,tFrom:t0,tTo:t1!==t0?t1:'',desc:sp?sp.notes||'':'',descOrig:sp?sp.notes||'':''});
    d.stops.push(st);
    k.cs.forEach(function(c){(c.items||[]).forEach(function(it){d.items.push(Object.assign({},it,{stopId:st.id,spotId:k.spotId||null}))})});
  });
  var site=null, f0=cl[0];
  if(f0.spotId){var sp0=spots.filter(function(s){return s.id===f0.spotId})[0];if(sp0&&sp0.siteId)site=siteOf(sp0.siteId)}
  if(!site){var ns=nearestSite(f0.lat,f0.lon,600);if(ns)site=ns.s}
  if(site){d.siteId=site.id;d.siteName=site.name;d.siteLat=site.lat;d.siteLon=site.lon;d.siteDesc=site.desc||'';d.siteDescOrig=site.desc||'';d.newSite=false;d.step=1}
  else d.step=0;
  d.fromQuick=Q.map(function(c){return c.id});
  d.stops.forEach(function(s,i){try{fillStopFromForecast(i,true)}catch(e){}});
  renderStep();
  toast(Q.length+(Q.length===1?' captura pasada':' capturas pasadas')+' a la salida: añade lo que falte y guarda');
}

function qcSpotMake(id){
  var c=catches.filter(function(x){return x.id===id})[0]; if(!c||c.lat==null)return;
  var ns=nearestSite(c.lat,c.lon,600);
  QS={id:id,siteId:ns?ns.s.id:''};
  var opts='<option value="">(sin sitio)</option>'+sites.slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name),'es')}).map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===QS.siteId?' selected':'')+'>'+esc(s.name)+'</option>'}).join('');
  var near=quickList().filter(function(x){return !x.spotId&&x.lat!=null&&hvM(c.lat,c.lon,x.lat,x.lon)<=40}).length;
  openSheet('Hacer spot','<div class="block"><p class="hint">Se crea un spot en el punto donde pescaste ('+c.lat.toFixed(5)+', '+c.lon.toFixed(5)+')'+(near>1?' y se le asignan las '+near+' capturas rápidas de ese punto':'')+'. Luego puedes editarlo en Mapa.</p><div class="field"><label for="qs-name">Nombre</label><input id="qs-name" maxlength="80" placeholder="Ej. Roca de la izquierda"></div><div class="field"><label for="qs-site">Sitio</label><select id="qs-site">'+opts+'</select></div></div>','<button class="btn" data-a="close-sheet">Cancelar</button><button class="btn primary" data-a="qs-save" id="qs-save">Crear spot</button>');
}
async function qsSave(){
  var c=QS&&catches.filter(function(x){return x.id===QS.id})[0]; if(!c)return;
  var nm=($('#qs-name').value||'').trim(); if(!nm){toast('Ponle nombre al spot');return}
  var siteId=$('#qs-site').value||null, btn=$('#qs-save'); btn.disabled=true;
  try{
    var ref=db.collection('spots').doc();
    await ref.set({name:nm,siteId:siteId,lat:c.lat,lon:c.lon,notes:'',createdAt:Date.now()});
    var Q=quickList().filter(function(x){return !x.spotId&&x.lat!=null&&hvM(c.lat,c.lon,x.lat,x.lon)<=40});

/* ================= CEBOS ================= */
var BAITS_NAT=['Gamba arrocera','Gamba blanca','Langostino','Mejillón','Sardina','Caballa','Anchoa','Chipirón','Calamar','Sepia','Cangrejo','Lombriz','Gusana','Lapa','Navaja'];
var BAITS_ART=['Vinilo','Jig','Minnow','Vibrador','Cucharilla','Popper','Plumas'];
function usedBaits(){
  var m={};
  var add=function(n,t){if(!n)return;var k=norm(n);if(!m[k])m[k]={n:n,t:0};if(t>m[k].t)m[k].t=t};
  catches.forEach(function(c){(c.items||[]).forEach(function(i){add(i.bait,c.ts||c.createdAt||0)})});
  trips.forEach(function(t){(t.stops||[]).forEach(function(s){(s.baits||[]).forEach(function(b){add(b,t.createdAt||0)})})});
  return m;
}
var ART_RX=/vinil|jig|minnow|se[ñn]uelo|cucharilla|popper|shad|vibr|pluma|paseante|stick|crank|rapala|lipless|spoon|spinner|goma|metal|pez artificial|r[ií]gido/i;
function isArtBait(n){return BAITS_ART.map(norm).indexOf(norm(n))>-1||ART_RX.test(n)}
function allBaits(){
  var u=usedBaits(), known={}, out=[], outA=[];
  BAITS_NAT.concat(BAITS_ART).forEach(function(n){known[norm(n)]=1});
  Object.keys(u).forEach(function(k){if(!known[k])(isArtBait(u[k].n)?outA:out).push(u[k].n)});
  return {nat:BAITS_NAT.concat(out.sort()),art:BAITS_ART.concat(outA.sort())};
}
function recentBaits(max){
  var u=usedBaits(), list=Object.keys(u).sort(function(a,b){return u[b].t-u[a].t}).map(function(k){return u[k].n});
  ['Gamba arrocera','Langostino','Mejillón','Sardina','Caballa'].forEach(function(n){if(list.map(norm).indexOf(norm(n))<0)list.push(n)});
  return list.slice(0,max||8);
}
function lastBait(){
  var best=null;
  catches.forEach(function(c){(c.items||[]).forEach(function(i){var t=c.ts||c.createdAt||0;if(i.bait&&(!best||t>best.t))best={t:t,n:i.bait}})});
  return best&&Date.now()-best.t<24*3600000?best.n:'';
}
/* --- en la parada --- */
function baitBlock(s,i){
  var b=allBaits(), sel=(s.baits||[]).map(norm), kn=b.nat.concat(b.art).map(norm);
  (s.baits||[]).forEach(function(n){if(kn.indexOf(norm(n))<0){(isArtBait(n)?b.art:b.nat).push(n);kn.push(norm(n))}});
  var chip=function(n){return '<button type="button" class="bchip'+(sel.indexOf(norm(n))>-1?' on':'')+'" data-a="bait-tog" data-si="'+i+'" data-n="'+esc(n)+'" aria-pressed="'+(sel.indexOf(norm(n))>-1)+'">'+esc(n)+'</button>'};
  return '<div class="field baitf"><label>Carnada y señuelos</label><div class="bchips"><small>Carnada</small>'+b.nat.map(chip).join('')+'</div><div class="bchips"><small>Artificiales</small>'+b.art.map(chip).join('')+'</div>'+
    '<div class="baddrow"><input id="bn-'+i+'" maxlength="40" placeholder="Otra carnada…" aria-label="Otra carnada"><button type="button" class="btn small" data-a="bait-add" data-si="'+i+'">Añadir</button></div>'+

function baitInject(sel,draft,stopsOf){
  var el=$(sel); if(!el||!draft)return;
  var rows=el.querySelectorAll('.irow'), all=allBaits();
  Array.prototype.forEach.call(rows,function(r,ix){
    var it=draft.items[ix]; if(!it||r.querySelector('.baitsel'))return;
    var st=stopsOf(it), mine=(st&&st.baits||[]), rest=all.nat.concat(all.art).filter(function(n){return mine.map(norm).indexOf(norm(n))<0});
    if(it.bait&&mine.concat(rest).map(norm).indexOf(norm(it.bait))<0)rest.unshift(it.bait);
    var opt=function(n){return '<option value="'+esc(n)+'"'+(norm(it.bait||'')===norm(n)?' selected':'')+'>'+esc(n)+'</option>'};
    r.insertAdjacentHTML('beforeend','<div class="field baitsel" style="margin:8px 0 0"><label>Cebo con el que picó</label><select data-a="ibait" data-i="'+ix+'" aria-label="Cebo de esta captura"><option value="">(sin apuntar)</option>'+(mine.length?'<optgroup label="Usados en este spot">'+mine.map(opt).join('')+'</optgroup>':'')+'<optgroup label="Otros">'+rest.map(opt).join('')+'</optgroup></select></div>');
  });
}

/* --- estadísticas --- */
function legOfItem(c,i){
  if(!c.tripId)return null;
  var ls=legs.filter(function(l){return l.tripId===c.tripId});
  var sid=i.stopId!=null?String(i.stopId):(c.stopId!=null?String(c.stopId):null);
  return (sid!=null?ls.filter(function(l){return l.stopId===sid})[0]:null)||(ls.length===1?ls[0]:null);
}
function baitStats(){
  var S={};
  var g=function(n){var k=norm(n);return S[k]||(S[k]={k:k,n:n,fish:0,sp:{},spots:{},outs:{},mins:0,legsUsed:0})};
  legs.forEach(function(l){
    var bs=l.baits||[]; if(!bs.length)return;
    var a=hm(l.tFrom),b=hm(l.tTo), mins=a!=null&&b!=null&&b>a?b-a:0;
    bs.forEach(function(n){var x=g(n);x.legsUsed++;x.outs[l.tripId]=1;x.mins+=mins/bs.length});
  });
  catches.forEach(function(c){(c.items||[]).forEach(function(i){
    var l=legOfItem(c,i), bait=i.bait||(l&&l.baits&&l.baits.length===1?l.baits[0]:null);
    if(!bait||!(i.n>0))return;
    var x=g(bait);x.fish+=i.n;var sp=norm(i.species);x.sp[sp]=(x.sp[sp]||0)+i.n;if(!x.spn)x.spn={};x.spn[sp]=i.species;
    var sid=i.spotId||(l&&l.spotId)||c.spotId;if(sid)x.spots[sid]=(x.spots[sid]||0)+i.n;
    x.outs[c.tripId||('d'+c.date)]=1;
  })});
  return S;
}
function topBaitFor(spKey,spotIds){
  var best=null,c={};
  catches.forEach(function(ct){(ct.items||[]).forEach(function(i){
    if(norm(i.species)!==spKey||!(i.n>0))return;
    var l=legOfItem(ct,i), b=i.bait||(l&&l.baits&&l.baits.length===1?l.baits[0]:null); if(!b)return;
    var sid=i.spotId||(l&&l.spotId)||ct.spotId, w=i.n*((spotIds&&sid&&spotIds.indexOf(sid)>-1)?2:1);
    c[b]=(c[b]||0)+w;
  })});
  Object.keys(c).forEach(function(b){if(!best||c[b]>c[best])best=b});
  return best;
}
function baitsCard(){
  var S=baitStats(), L=Object.keys(S).map(function(k){return S[k]}).filter(function(x){return x.fish||x.legsUsed});
  if(!L.length)return '';
  L.sort(function(a,b){return b.fish-a.fish||b.legsUsed-a.legsUsed});
  return '<section class="baitcard"><div class="sect"><h2>Tus cebos</h2><span>qué funciona</span></div><div class="block">'+L.slice(0,8).map(function(x){
    var h=x.mins/60, rate=h>=0.5?x.fish/h:null, top=Object.keys(x.sp).sort(function(a,b){return x.sp[b]-x.sp[a]}).slice(0,2).map(function(k){return x.spn[k]+' ×'+x.sp[k]}).join(' · ');
    return '<div class="brow"><b>'+esc(x.n)+'</b><span class="bn">'+x.fish+(x.fish===1?' pez':' peces')+'</span><small>'+Object.keys(x.outs).length+(Object.keys(x.outs).length===1?' salida':' salidas')+(rate!=null?' · '+num(rate,1)+' peces/h':'')+(top?' · '+esc(top):'')+'</small></div>';
  }).join('')+'<p class="hint">Un cebo con pocas salidas es solo una pista. Los peces/h salen de las horas que has anotado con ese cebo.</p></div></section>';
}

/* ================= BARRIDO (03/11/2026, v1) =================

   cómo estaba ola/viento/marea y qué le falta. Se guarda en la colección

var SWEEPS=[], SW=null, SWW=null;

  var a=[];

  if(m.windV==='mucho')a.push('menos viento');
  if(m.tideV==='poco')a.push('más marea');else if(m.tideV==='mucho')a.push('menos marea');

}
function swVPills(m){
  var o='';

var _spotModel13=spotModel;
spotModel=function(s){

    var poW=ls.filter(function(l){return l.waveV==='poco'&&l.wave!=null&&l.wave!==''}).map(function(l){return +l.wave});
    var fl=null;
    if(okW.length)fl=Math.max(0,Math.min.apply(null,okW)-0.15);
    if(poW.length)fl=Math.max(fl==null?0:fl,Math.max.apply(null,poW)+0.05);
    if(fl!=null)e.minWave=e.maxWave!=null?Math.min(fl,e.maxWave):fl;
  }
  if(e.minWave==null&&e.maxWave!=null){e.minWave=Math.round(e.maxWave*0.45*100)/100;est=true}
  if(T.lo==null&&T.hi!=null){T.lo=Math.round(T.hi*0.45*100)/100;T.estLo=true;est=true}
  M.K.wave=e.minWave!=null||e.maxWave!=null; M.K.tide=T.lo!=null||T.hi!=null;

recentSpecies=function(){

  catches.forEach(function(c){

      if(!i.species)return; var k=norm(i.species), n=i.n||1;

  if(!c)return h;
  return '<div class="invrow"><span class="invl">Bobina del carrete</span><div class="chips invchips">'+c.bobinas.map(function(b,k){var on=e.bobina===(b.nom||'Bobina '+(k+1));return '<button type="button" class="chip'+(on?' on':'')+'" data-a="bob-use" data-i="'+i+'" data-k="'+k+'" data-id="'+esc(c.id)+'" aria-pressed="'+on+'">'+esc((b.nom||'Bobina '+(k+1))+(b.linea?' · '+eqMm(b.linea)+' mm':''))+'</button>'}).join('')+'</div></div>'+h;
};

  GOPEN.top=true;GOPEN['e'+i+'cana']=true;gearRepaint();
